<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>铭心阁</title>
  <style>
    /* 全局重置 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f5efe8;  /* 温润宣纸色 */
      color: #2c241b;
      font-family: '华文楷体', 'KaiTi', '宋体', 'SimSun', serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1.5rem;
    }

    /* 主容器 — 无框无饰，仅留内边距与背景 */
    .scroll {
      max-width: 880px;
      width: 100%;
      background: transparent;  /* 完全透明，让底色透出 */
      padding: 1rem 0.5rem;
      text-align: center;
    }

    /* 标题 — 干净厚重 */
    .header h1 {
      font-size: 4rem;
      font-weight: normal;
      letter-spacing: 20px;
      color: #3b2a1e;
      margin-bottom: 2.8rem;
      line-height: 1.2;
    }

    /* 四个版块网格 — 简洁块状，无边框 */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2rem;
      margin: 2rem 0 3rem;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #faf6f0;   /* 极浅底色，区别于背景 */
      padding: 2.2rem 0.5rem;
      border-radius: 4px;    /* 微圆角，近乎直角，更显古朴 */
      text-decoration: none;
      color: #3b2a1e;
      font-size: 2.2rem;
      letter-spacing: 8px;
      transition: background 0.25s ease, transform 0.15s ease;
      box-shadow: none;      /* 无阴影 */
      border: none;          /* 无边框 */
    }

    .item:hover {
      background: #e8dfd2;   /* 沉稳的浅褐 */
      transform: translateY(-2px);
    }

    /* 页脚 — 仅文字，无线条 */
    .footer {
      margin-top: 2.5rem;
      font-size: 1.6rem;
      letter-spacing: 12px;
      color: #3b2a1e;
      opacity: 0.7;
    }

    /* 响应式 */
    @media (max-width: 700px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 1.5rem;
      }
      .item {
        font-size: 1.8rem;
        padding: 1.8rem 0.5rem;
      }
      .header h1 {
        font-size: 3rem;
        letter-spacing: 14px;
      }
    }

    @media (max-width: 450px) {
      .grid {
        grid-template-columns: 1fr;
        gap: 1.2rem;
      }
      .item {
        font-size: 1.6rem;
        padding: 1.5rem 0.5rem;
      }
      .header h1 {
        font-size: 2.4rem;
        letter-spacing: 10px;
      }
      .footer {
        font-size: 1.2rem;
        letter-spacing: 8px;
      }
    }
  </style>
</head>
<body>
<div class="scroll">

  <!-- 标题：仅铭心阁 -->
  <div class="header">
    <h1>铭心阁</h1>
  </div>

  <!-- 四个版块：简帙、识辨辑、自然钟、医战 -->
  <div class="grid">
    <a href="./jianzhi/" class="item">简帙</a>
    <a href="./shibianji/" class="item">识辨辑</a>
    <a href="./ziranzhong/" class="item">自然钟</a>
    <a href="./yizhan/" class="item">医战</a>
  </div>

  <!-- 页脚：铭心阁 -->
  <div class="footer">铭心阁</div>

</div>
</body>
</html>
