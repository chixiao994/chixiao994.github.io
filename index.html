<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>铭心阁</title>
  <style>
    /* ===== 重置 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f5efe8;
      color: #2c241b;
      font-family: '华文楷体', 'KaiTi', '宋体', 'SimSun', serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1.5rem;
    }

    .scroll {
      max-width: 920px;
      width: 100%;
      background: transparent;
      padding: 1rem 0.5rem;
      text-align: center;
    }

    /* ===== 第一层 · 标题 ===== */
    .header h1 {
      font-size: 4.8rem;
      font-weight: normal;
      letter-spacing: 24px;
      color: #2c1f15;
      margin-bottom: 0.6rem;
      line-height: 1.15;
      text-shadow: 0 2px 4px rgba(44, 31, 21, 0.06);
      font-family: '华文篆书', '方正小篆体', 'STZhongsong', '汉仪篆书', '篆体',
                   'PingFang SC', 'Heiti SC', 'STHeiti',
                   'Microsoft YaHei', 'SimHei',
                   'Roboto', 'Noto Sans CJK SC', 'Noto Sans',
                   '-apple-system', 'BlinkMacSystemFont', 'system-ui',
                   'sans-serif',
                   '华文楷体', 'KaiTi', '宋体', serif;
    }

    /* ===== 第二层 · 序言 ===== */
    .preface {
      font-size: 1.05rem;
      line-height: 2;
      color: #6b5a4a;
      letter-spacing: 3px;
      margin: 0.2rem 0 2.8rem 0;
      padding: 0 2.5rem;
      font-weight: 300;
      opacity: 0.8;
      text-align: left;
    }

    .preface p {
      margin: 0;
      text-indent: 0;
    }

    /* ===== 第三层 · 四个版块 ===== */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.8rem;
      margin-top: 0.8rem;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0e8de;
      padding: 2.4rem 0.5rem;
      border-radius: 6px;
      text-decoration: none;
      color: #3b2a1e;
      font-size: 2rem;
      letter-spacing: 8px;
      transition: background 0.3s ease, transform 0.2s ease,
                  box-shadow 0.3s ease;
      box-shadow: 0 4px 12px rgba(44, 31, 21, 0.06),
                  inset 0 1px 0 rgba(255, 248, 240, 0.5);
      border: none;
      transform: translateY(0);
      font-family: '华文隶书', '方正隶书', '汉仪隶书', 'STLiti', '隶书',
                   '华文楷体', 'KaiTi', '宋体', serif;
    }

    .item:hover {
      background: #e4d9cb;
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(44, 31, 21, 0.12),
                  inset 0 1px 0 rgba(255, 248, 240, 0.4);
    }

    .item:nth-child(1) { background: #ede5d8; }
    .item:nth-child(2) { background: #efe7db; }
    .item:nth-child(3) { background: #ece3d6; }
    .item:nth-child(4) { background: #eee6d9; }

    .item:nth-child(1):hover { background: #e2d7c7; }
    .item:nth-child(2):hover { background: #e4d9ca; }
    .item:nth-child(3):hover { background: #e0d5c4; }
    .item:nth-child(4):hover { background: #e3d8c8; }

    /* ===== 响应式：手机端精准适配 ===== */
    @media (max-width: 760px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 1.2rem;
      }
      .item {
        font-size: 1.7rem;
        padding: 1.8rem 0.5rem;
      }
      .header h1 {
        font-size: 3.4rem;
        letter-spacing: 16px;
      }
      .preface {
        font-size: 0.95rem;
        padding: 0 1.8rem;
        margin-bottom: 2rem;
      }
    }

    @media (max-width: 460px) {
      .grid {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      .item {
        font-size: 1.5rem;
        padding: 1.4rem 0.5rem;
      }
      .header h1 {
        font-size: 2.6rem;
        letter-spacing: 12px;
      }

      /* 
        手机序言：调整内边距、字号与字间距，使文字恰好三行并排满。
        启用两端对齐，自动调整字间距，视觉整齐。
        可根据实际手机宽度微调 padding 和 font-size。
      */
      .preface {
        font-size: 1rem;           /* 略微增大，减少行数 */
        letter-spacing: 0.05em;    /* 字间距适应，配合两端对齐 */
        padding: 0 2.2rem;         /* 左右留白增大，压缩可用宽度 */
        margin-bottom: 1.6rem;
        text-align: justify;       /* 两端对齐，每行均匀填满 */
        text-justify: inter-ideograph; /* 中文两端对齐优化 */
      }
    }
  </style>
</head>
<body>
<div class="scroll">

  <!-- 标题 -->
  <div class="header">
    <h1>铭心阁</h1>
  </div>

  <!-- 序言 -->
  <div class="preface">
    <p>铭心阁者，聚简帙以齐古籍，立识辨辑以辨源流，设自然钟以观天时，创医战以习岐黄。愿承先贤之智，启后学之思。</p>
  </div>

  <!-- 四个版块 -->
  <div class="grid">
    <a href="./jianzhi/" class="item">简帙</a>
    <a href="./shibianji/" class="item">识辨辑</a>
    <a href="./ziranzhong/" class="item">自然钟</a>
    <a href="./yizhan/" class="item">医战</a>
  </div>

</div>
</body>
</html>
