<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}识辨辑</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-size: 1rem;
            line-height: 1.6;
            color: #1e1e1e;
            background-color: #faf9f8;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        /* 可以添加更多样式，例如标题、引用、代码块等 */
        h1, h2, h3, h4, h5, h6 {
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            font-weight: 500;
        }
        h1 { font-size: 1.8rem; border-bottom: 1px solid #eaecef; padding-bottom: 0.3rem; }
        h2 { font-size: 1.5rem; border-bottom: 1px solid #eaecef; padding-bottom: 0.2rem; }
        p { margin-bottom: 1rem; }
        ul, ol { margin-bottom: 1rem; padding-left: 2rem; }
        a { color: #2c6e2f; text-decoration: none; border-bottom: 1px dotted #c8d6c8; }
        a:hover { border-bottom-color: #2c6e2f; }
        .back-link { margin-top: 2rem; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        {{ content }}
        <div class="back-link">
            <a href="{{ '/' | relative_url }}">← 返回主页</a>
        </div>
    </div>
</body>
</html>
