<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>简帙 · 工器谱 · 铭心阁</title>
    <style>
        /* ===== 全局 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --paper: #f5f0e8;
            --paper-white: #fcf9f5;
            --ink: #2c1810;
            --ink-light: #5a3f36;
            --zhu-red: #8b1a1a;
            --zhu-red-light: #b33a3a;
            --gold: #c9a96e;
            --border-light: #e8dfd6;
            --radius: 6px;
            --shadow: 0 2px 16px rgba(44, 24, 16, 0.08);
            --transition: 0.25s ease;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: "Noto Serif SC", "思源宋体", "Source Han Serif SC", "华文宋体", serif;
            background: var(--paper);
            color: var(--ink);
            line-height: 1.8;
            padding: 2rem 1rem;
            min-height: 100vh;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
            background: var(--paper-white);
            padding: 2rem 2.5rem 3rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }

        /* ===== 顶部（居中，黑体加粗） ===== */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid var(--border-light);
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .top-bar .brand {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: 4px;
            text-align: center;
            font-family: "Noto Sans SC", "微软雅黑", "PingFang SC", sans-serif;
        }
        .top-bar .brand .sub {
            font-weight: 400;
            font-size: 0.9rem;
            color: var(--ink-light);
            letter-spacing: 2px;
            opacity: 0.6;
            margin-left: 6px;
            font-family: "Noto Serif SC", "思源宋体", serif;
        }

        /* ===== 序言 ===== */
        .preface {
            margin: 0.5rem 0 1.8rem 0;
            padding: 0.2rem 0;
        }
        .preface p {
            font-size: 0.95rem;
            color: var(--ink-light);
            text-indent: 2em;
            line-height: 2.2;
            opacity: 0.8;
        }

        /* ===== 独立下载区（带框，无图标，文字不加粗） ===== */
        .download-section {
            margin: 0 0 1.2rem 0;
            padding: 1.2rem 1.5rem;
            background: var(--paper);
            border-radius: var(--radius);
            border: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: space-between;
        }
        .download-section .info {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .download-section .info .label {
            font-size: 0.9rem;
            color: var(--ink);
            font-weight: 400;
        }
        .download-section .info .label strong {
            color: var(--zhu-red);
            font-weight: 600;
        }
        .download-section .info .version {
            font-size: 0.75rem;
            color: var(--ink-light);
            opacity: 0.4;
            margin-left: 0.2rem;
        }
        .download-section .btn-group {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .download-section .btn {
            display: inline-block;
            background: var(--zhu-red);
            color: #fff;
            padding: 0.4rem 1.6rem;
            border-radius: 40px;
            text-decoration: none;
            font-size: 0.85rem;
            border: 1px solid var(--zhu-red);
            transition: var(--transition);
            letter-spacing: 1px;
        }
        .download-section .btn:hover {
            background: var(--zhu-red-light);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(139, 26, 26, 0.15);
        }
        @media (max-width: 600px) {
            .download-section {
                flex-direction: column;
                align-items: stretch;
                gap: 0.8rem;
                padding: 1rem 1rem;
            }
            .download-section .info {
                justify-content: center;
            }
            .download-section .btn-group {
                justify-content: center;
            }
        }

        /* ===== 主程序卡片（标题居中，描述左对齐，无篇数） ===== */
        .main-card {
            display: block;
            background: var(--paper);
            border-radius: var(--radius);
            padding: 1.8rem 2rem 1.5rem;
            margin: 0 0 2.5rem 0;
            border: 1px solid var(--border-light);
            transition: var(--transition);
            text-decoration: none;
            color: var(--ink);
            position: relative;
        }
        .main-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 24px rgba(44, 24, 16, 0.08);
            border-color: var(--gold);
            background: #f8f4ee;
        }
        .main-card .card-header {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            text-align: center;
        }
        .main-card .card-header h2 {
            font-size: 1.2rem;
            color: var(--zhu-red);
            letter-spacing: 3px;
            border: none;
            margin: 0;
        }
        .main-card .card-desc {
            font-size: 0.9rem;
            color: var(--ink-light);
            margin-top: 0.3rem;
            line-height: 1.8;
            opacity: 0.7;
            text-align: left;
        }

        /* ===== 四艺卡片（无篇数徽标） ===== */
        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.2rem;
            margin: 0.5rem 0 0.5rem;
        }
        .grid-4 .card {
            background: var(--paper);
            border-radius: var(--radius);
            padding: 1.8rem 1rem 1.5rem;
            text-align: center;
            border: 1px solid var(--border-light);
            transition: var(--transition);
            text-decoration: none;
            color: var(--ink);
            display: block;
        }
        .grid-4 .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 24px rgba(44, 24, 16, 0.06);
            border-color: var(--gold);
            background: #f8f4ee;
        }
        .grid-4 .card h3 {
            font-size: 1.05rem;
            color: var(--ink);
            letter-spacing: 3px;
            font-weight: 600;
        }
        .grid-4 .card .desc {
            font-size: 0.8rem;
            color: var(--ink-light);
            margin-top: 0.3rem;
            line-height: 1.6;
            opacity: 0.7;
        }

        /* ===== 分隔线 ===== */
        .divider {
            margin: 0 0 1.2rem 0;
            border-top: 1px solid var(--border-light);
            opacity: 0.4;
        }

        /* ===== 底部版权 ===== */
        .footer-note {
            margin-top: 2.5rem;
            font-size: 0.8rem;
            text-align: center;
            color: var(--ink-light);
            border-top: 1px solid var(--border-light);
            padding-top: 1.2rem;
            letter-spacing: 1px;
            opacity: 0.5;
        }

        /* ===== 返回顶部 ===== */
        .back-to-top-ball {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(44, 24, 16, 0.04);
            border: 1px solid rgba(44, 24, 16, 0.10);
            color: var(--ink-light);
            font-size: 1.4rem;
            line-height: 44px;
            text-align: center;
            text-decoration: none;
            transition: var(--transition);
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 12px rgba(44, 24, 16, 0.04);
            font-family: serif;
        }
        .back-to-top-ball:hover {
            background: rgba(44, 24, 16, 0.08);
            transform: translateY(-2px);
            color: var(--zhu-red);
        }

        @media (max-width: 600px) {
            .container {
                padding: 1.2rem 1rem 2rem;
            }
            .grid-4 {
                grid-template-columns: 1fr 1fr;
                gap: 0.8rem;
            }
            .top-bar .brand {
                font-size: 1.2rem;
            }
            .main-card {
                padding: 1.2rem 1rem;
            }
            .main-card .card-header {
                flex-direction: column;
                align-items: center;
            }
            .preface p {
                font-size: 0.9rem;
            }
            .download-section {
                padding: 1rem 1rem;
            }
        }
        @media (max-width: 400px) {
            .grid-4 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

        <!-- ===== 底部版权 ===== -->

    <!-- ===== 返回顶部 ===== -->
    <a href="#" id="backToTop" class="back-to-top-ball" aria-label="返回顶部">^</a>

    <script>
        document.getElementById('backToTop').addEventListener('click', function(e) {
            e.preventDefault();

        });
    </script>

</body>
</html>
