<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>简帙 · 工器谱 · 铭心阁</title>
    <style>
        /* ===== 全局 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --paper: #f5f0e8;
            --paper-white: #fcf9f5;
            --ink: #2c1810;
            --ink-light: #5a3f36;
            --zhu-red: #8b1a1a;
            --zhu-red-light: #b33a3a;
            --gold: #c9a96e;
            --border-light: #e8dfd6;
            --radius: 6px;
            --shadow: 0 2px 16px rgba(44, 24, 16, 0.08);
            --transition: 0.25s ease;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: "Noto Serif SC", "思源宋体", "Source Han Serif SC", "华文宋体", serif;
            background: var(--paper);
            color: var(--ink);
            line-height: 1.8;
            padding: 2rem 1rem;
            min-height: 100vh;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
            background: var(--paper-white);
            padding: 2rem 2.5rem 3rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }

        /* ===== 顶部 ===== */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid var(--border-light);
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .top-bar .brand {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--ink);
            letter-spacing: 4px;
        }
        .top-bar .brand .sub {
            font-weight: 400;
            font-size: 0.9rem;
            color: var(--ink-light);
            letter-spacing: 2px;
            opacity: 0.6;
            margin-left: 6px;
        }

        /* ===== 序言（无边框） ===== */
        .preface {
            margin: 0.5rem 0 1.8rem 0;
            padding: 0.2rem 0;
        }
        .preface p {
            font-size: 0.95rem;
            color: var(--ink-light);
            text-indent: 2em;
            line-height: 2.2;
            opacity: 0.8;
        }

        /* ===== 四艺卡片 ===== */
        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.2rem;
            margin: 1.5rem 0 0.5rem;
        }
        .grid-4 .card {
            background: var(--paper);
            border-radius: var(--radius);
            padding: 1.8rem 1rem 1.5rem;
            text-align: center;
            border: 1px solid var(--border-light);
            transition: var(--transition);
            text-decoration: none;
            color: var(--ink);
            display: block;
        }
        .grid-4 .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 24px rgba(44, 24, 16, 0.06);
            border-color: var(--gold);
            background: #f8f4ee;
        }
        .grid-4 .card h3 {
            font-size: 1.1rem;
            color: var(--ink);
            letter-spacing: 4px;
            font-weight: 600;
        }
        .grid-4 .card .desc {
            font-size: 0.8rem;
            color: var(--ink-light);
            margin-top: 0.3rem;
            line-height: 1.6;
            opacity: 0.7;
        }

        /* ===== 下载区 ===== */
        .download-section {
            margin-top: 2.5rem;
            padding: 1.8rem 2rem;
            background: var(--paper);
            border-radius: var(--radius);
            border: 1px solid var(--border-light);
            text-align: center;
        }
        .download-section h2 {
            font-size: 1.2rem;
            color: var(--ink);
            letter-spacing: 3px;
            margin-bottom: 0.3rem;
            border: none;
        }
        .download-section p {
            color: var(--ink-light);
            font-size: 0.9rem;
            max-width: 500px;
            margin: 0 auto 1rem;
            line-height: 1.8;
            opacity: 0.7;
        }
        .download-section .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .download-section .btn {
            display: inline-block;
            background: var(--zhu-red);
            color: #fff;
            padding: 0.5rem 2rem;
            border-radius: 40px;
            text-decoration: none;
            font-size: 0.9rem;
            border: 1px solid var(--zhu-red);
            transition: var(--transition);
            letter-spacing: 1px;
        }
        .download-section .btn:hover {
            background: var(--zhu-red-light);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(139, 26, 26, 0.15);
        }
        .download-section .btn-outline {
            background: transparent;
            color: var(--zhu-red);
            border-color: var(--zhu-red);
        }
        .download-section .btn-outline:hover {
            background: var(--zhu-red);
            color: #fff;
        }
        .download-section .meta {
            margin-top: 0.8rem;
            font-size: 0.75rem;
            color: var(--ink-light);
            opacity: 0.5;
            letter-spacing: 1px;
        }

        /* ===== 底部版权 ===== */
        .footer-note {
            margin-top: 2.5rem;
            font-size: 0.8rem;
            text-align: center;
            color: var(--ink-light);
            border-top: 1px solid var(--border-light);
            padding-top: 1.2rem;
            letter-spacing: 1px;
            opacity: 0.5;
        }

        /* ===== 返回顶部 ===== */
        .back-to-top-ball {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(44, 24, 16, 0.04);
            border: 1px solid rgba(44, 24, 16, 0.10);
            color: var(--ink-light);
            font-size: 1.4rem;
            line-height: 44px;
            text-align: center;
            text-decoration: none;
            transition: var(--transition);
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 12px rgba(44, 24, 16, 0.04);
            font-family: serif;
        }
        .back-to-top-ball:hover {
            background: rgba(44, 24, 16, 0.08);
            transform: translateY(-2px);
            color: var(--zhu-red);
        }

        @media (max-width: 600px) {
            .container {
                padding: 1.2rem 1rem 2rem;
            }
            .grid-4 {
                grid-template-columns: 1fr 1fr;
                gap: 0.8rem;
            }
            .top-bar .brand {
                font-size: 1.2rem;
            }
            .download-section {
                padding: 1.5rem 1rem;
            }
            .download-section .btn-group {
                flex-direction: column;
                align-items: center;
            }
            .preface p {
                font-size: 0.9rem;
            }
        }
        @media (max-width: 400px) {
            .grid-4 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ===== 顶部栏 ===== -->
        <div class="top-bar">
            <div class="brand">
                简帙<span class="sub">· 工器谱</span>
            </div>
        </div>

        <!-- ===== 序言（无边框） ===== -->
        <div class="preface">
            <p>简帙者，集工器之理论，汇四艺之精要。字库以立其本，切拼以成其形，重排以调其气，阅读以通其神。四者相承，乃为完璧。兹录诸篇，以备览者参详。</p>
        </div>

        <!-- ===== 四艺入口 ===== -->
        <div class="grid-4">
            <a href="ziku/" class="card">
                <h3>字库制作</h3>
                <div class="desc">字体源流 · 字库建构</div>
            </a>
            <a href="shuangye/" class="card">
                <h3>双页切拼</h3>
                <div class="desc">版式切割 · 拼接重组</div>
            </a>
            <a href="zhiban/" class="card">
                <h3>制版重排</h3>
                <div class="desc">版面调适 · 重排原理</div>
            </a>
            <a href="yuedu/" class="card">
                <h3>文档阅读</h3>
                <div class="desc">阅读法式 · 文献研究</div>
            </a>
        </div>

        <!-- ===== 下载区 ===== -->
        <div class="download-section">
            <h2>简帙古籍整理系统</h2>
            <p>集成字库制作、双页切拼、制版重排、文档阅读四大工器，助力古籍数字化整理与学术研究。</p>
            <div class="btn-group">
                <a href="https://pan.quark.cn/s/acd54713f4d5" target="_blank" class="btn" rel="noopener noreferrer">📥 夸克网盘</a>
                <a href="https://pan.baidu.com/s/1HuW0NXGxccT-LhJ9cse60Q?pwd=hqrt" target="_blank" class="btn btn-outline" rel="noopener noreferrer">📥 百度网盘</a>
            </div>
            <div class="meta">当前版本 v2.0 · 更新于 2026年6月</div>
        </div>

        <!-- ===== 底部版权 ===== -->
        <div class="footer-note">铭心阁 · 简帙工器谱</div>
    </div>

    <!-- ===== 返回顶部 ===== -->
    <a href="#" id="backToTop" class="back-to-top-ball" aria-label="返回顶部">^</a>

    <script>
        document.getElementById('backToTop').addEventListener('click', function(e) {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>

</body>
</html>
