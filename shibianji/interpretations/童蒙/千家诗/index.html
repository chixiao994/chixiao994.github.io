<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>明解增和千家诗 · 铭心阁识辨辑</title>
    <link rel="stylesheet" href="/shibianji/assets/css/common.css">
    <style>
        /* 后备样式 */
        .container p { text-indent: 2em; margin-bottom: 1rem; }
        .home-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: #2c6e2f;
            text-decoration: none;
            border-bottom: 1px solid #c8d6c8;
        }
        .home-link:hover { color: #1a4a1c; border-bottom-color: #2c6e2f; }
        .footer-note { margin-top: 2rem; font-size: 0.8rem; text-align: center; color: #8a9b8a; }

        /* 下载链接区 - 双条并排 */
        .download-links {
            margin: 2rem 0;
        }
        .download-links h2 {
            font-size: 1.1rem;
            margin: 0 0 1rem 0;
            color: #2c6e2f;
        }
        .download-grid {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .download-grid a {
            flex: 1;
            min-width: 160px;
            display: block;
            padding: 0.8rem 1.2rem;
            background: #f8f9fa;
            border: 1px solid #eaecef;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            color: #2c6e2f;
            font-size: 1rem;
            transition: 0.2s;
        }
        .download-grid a:hover {
            background: #edf0f3;
            border-color: #c8d6c8;
            transform: translateY(-1px);
        }
        .download-grid .note {
            display: block;
            font-size: 0.75rem;
            color: #8a9b8a;
            margin-top: 0.2rem;
        }
        @media (max-width: 480px) {
            .download-grid a {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 顶部：返回主页 -->
    <a href="/shibianji/" class="home-link">← 识辨辑</a>

    <!-- 书名（一级标题） -->
    <h1>明解增和千家诗</h1>
    <p>—— 谢枋得 编 · 赵南星 注 · 明万历刻本</p>


    <!-- 下载链接区 - 两个下载条并排 -->
    <div class="download-links">
        <h2>📄 下载资源</h2>
        <div class="download-grid">
            <a href="https://pan.quark.cn/s/916e358fff22" target="_blank" rel="noopener noreferrer">
                 夸克网盘
            </a>
            <a href="https://pan.baidu.com/s/148Qoyrghk8kjqaYm8goS4g?pwd=y424" target="_blank" rel="noopener noreferrer">
                 百度网盘
                <span class="note">提取码：y424</span>
            </a>
        </div>
    </div>

    <!-- 底部版权信息 -->
    <div class="footer-note">铭心阁识辨辑 · 古籍解读与知识重构</div>
</div>

<!-- 返回顶部小圆球 -->
<a href="#" id="backToTop" class="back-to-top-ball" aria-label="返回顶部">^</a>
<script>
    (function() {
        var btn = document.getElementById('backToTop');
        if (btn) {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }
    })();
</script>
</body>
</html>
