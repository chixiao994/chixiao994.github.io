<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>自然钟 · 时辰表盘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #e9e2d4;
            font-family: 'Segoe UI', 'Roboto', 'Noto Sans', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            max-width: 600px;
            width: 100%;
            background: #fffdf9;
            border-radius: 48px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: #3b5c3a;
            color: white;
            text-align: center;
            padding: 20px 16px 12px;
        }
        .header h1 {
            font-weight: 500;
            letter-spacing: 2px;
            font-size: 1.6rem;
        }
        .header p {
            font-size: 0.75rem;
            opacity: 0.8;
            margin-top: 6px;
        }
        .location-bar {
            background: #e9e2d4;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 0.8rem;
        }
        .location-bar input {
            width: 100px;
            padding: 6px 8px;
            border: none;
            border-radius: 30px;
            background: white;
            text-align: center;
        }
        .location-bar button {
            background: #3b5c3a;
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .clock-panel {
            padding: 20px;
            text-align: center;
        }
        canvas {
            width: 280px;
            height: 280px;
            margin: 0 auto;
            display: block;
            background: #fef8e7;
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .info-panel {
            padding: 16px 20px 24px;
            background: #f9f5ec;
            border-top: 1px solid #e6dfd1;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }
        .label {
            color: #6c5b4b;
            font-weight: 500;
        }
        .value {
            font-weight: 600;
            color: #3b5c3a;
        }
        .tip {
            background: #e9e2d4;
            border-radius: 28px;
            padding: 12px 16px;
            margin-top: 16px;
            font-size: 0.85rem;
            line-height: 1.4;
            color: #2e3a24;
        }
        .source-note {
            text-align: center;
            font-size: 0.7rem;
            color: #9c8a72;
            margin-top: 12px;
        }
        @media (max-width: 480px) {
            canvas {
                width: 240px;
                height: 240px;
            }
            .info-row {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <h1>🌿 自然钟</h1>
        <p>时辰 · 应天 · 养人</p>
    </div>
    <div class="location-bar">
        <span>📍</span>
        <input type="text" id="latInput" placeholder="纬度" value="">
        <input type="text" id="lonInput" placeholder="经度" value="">
        <button id="manualBtn">手动计算</button>
        <button id="gpsBtn">使用我的位置</button>
    </div>
    <div class="clock-panel">
        <canvas id="clockCanvas" width="280" height="280"></canvas>
    </div>
    <div class="info-panel">
        <div class="info-row"><span class="label">🌞 真太阳时</span><span class="value" id="trueTime">--:--:--</span></div>
        <div class="info-row"><span class="label">🌅 日出</span><span class="value" id="sunrise">--:--</span></div>
        <div class="info-row"><span class="label">🌇 日落</span><span class="value" id="sunset">--:--</span></div>
        <div class="info-row"><span class="label">🍃 节气</span><span class="value" id="term">----</span></div>
        <div class="info-row"><span class="label">⚖️ 当令脏腑</span><span class="value" id="dangling">----</span></div>
        <div class="tip" id="dailyTip">✨ 等待定位或手动输入…</div>
        <div class="source-note" id="sourceInfo"></div>
    </div>
</div>

<script>
    // ---------- 天文计算 ----------
    function equationOfTime(dayOfYear) {
        let B = (dayOfYear - 1) * 2 * Math.PI / 365;
        let eq = 0.000075 + 0.001868 * Math.cos(B) - 0.032077 * Math.sin(B)
                - 0.014615 * Math.cos(2*B) - 0.04089 * Math.sin(2*B);
        return eq * 229.18; // 分钟
    }
    function sunDeclination(dayOfYear) {
        let rad = 2 * Math.PI * (dayOfYear - 80) / 365;
        let dec = 0.006918 - 0.399912 * Math.cos(rad) + 0.070257 * Math.sin(rad)
                - 0.006758 * Math.cos(2*rad) + 0.000907 * Math.sin(2*rad)
                - 0.002697 * Math.cos(3*rad) + 0.00148 * Math.sin(3*rad);
        return dec * 180 / Math.PI;
    }
    function getTrueSolarTime(lat, lon, utcDate) {
        let dayOfYear = Math.floor((utcDate - new Date(utcDate.getFullYear(), 0, 0)) / 86400000);
        let eot = equationOfTime(dayOfYear);
        let lonCorr = lon / 15;
        let noonUTC = 12 - lonCorr - eot/60;
        let currentUTC = utcDate.getUTCHours() + utcDate.getUTCMinutes()/60 + utcDate.getUTCSeconds()/3600;
        let trueSolar = 12 + (currentUTC - noonUTC);
        trueSolar = (trueSolar % 24 + 24) % 24;
        return trueSolar;
    }
    function getSunriseSunsetUTC(lat, lon, utcDate) {
        let dayOfYear = Math.floor((utcDate - new Date(utcDate.getFullYear(), 0, 0)) / 86400000);
        let dec = sunDeclination(dayOfYear);
        let phi = lat * Math.PI/180;
        let delta = dec * Math.PI/180;
        let cosHa = (Math.sin(-0.833 * Math.PI/180) - Math.sin(phi) * Math.sin(delta)) /
                    (Math.cos(phi) * Math.cos(delta));
        if (cosHa <= -1) return [0, 24];
        if (cosHa >= 1) return [0, 24];
        let Ha = Math.acos(cosHa) * 180 / Math.PI;
        let eot = equationOfTime(dayOfYear);
        let lonCorr = lon / 15;
        let noonUTC = 12 - lonCorr - eot/60;
        let sunrise = noonUTC - Ha/15;
        let sunset = noonUTC + Ha/15;
        sunrise = (sunrise % 24 + 24) % 24;
        sunset = (sunset % 24 + 24) % 24;
        return [sunrise, sunset];
    }
    function getSunLongitude(utcDate) {
        let dayOfYear = Math.floor((utcDate - new Date(utcDate.getFullYear(), 0, 0)) / 86400000);
        let daysSinceSpring = dayOfYear - 79;
        let lon = (daysSinceSpring / 365.25) * 360;
        lon = (lon % 360 + 360) % 360;
        return lon;
    }
    const solarTerms = ["立春","雨水","惊蛰","春分","清明","谷雨","立夏","小满","芒种","夏至","小暑","大暑","立秋","处暑","白露","秋分","寒露","霜降","立冬","小雪","大雪","冬至","小寒","大寒"];
    function getSolarTermName(sunLon) {
        let idx = Math.floor((sunLon + 7.5) % 360 / 15);
        return solarTerms[idx % 24];
    }
    function getMainQi(sunLon) {
        if ((sunLon >= 315 && sunLon < 360) || (sunLon >= 0 && sunLon < 45)) return "寒";
        if (sunLon >= 45 && sunLon < 135) return "暑";
        if (sunLon >= 135 && sunLon < 225) return "湿";
        if (sunLon >= 225 && sunLon < 315) return "燥";
        return "风";
    }
    // 时辰划分 (真太阳时)
    const traditionalZodiac = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
    // 重新排序使午时在上、子时在下：顺序为午、未、申、酉、戌、亥、子、丑、寅、卯、辰、巳
    const zodiacDisplay = ["午","未","申","酉","戌","亥","子","丑","寅","卯","辰","巳"];
    function getZodiacIndex(trueSolarHour) {
        let h = (trueSolarHour + 1) % 24;
        return Math.floor(h / 2) % 12;
    }
    // 映射传统索引到显示索引（传统索引6午->显示0，传统索引0子->显示6）
    function mapToDisplayIndex(traditionalIdx) {
        return (traditionalIdx + 6) % 12;
    }
    const organMap = {0:"胆",1:"肝",2:"肺",3:"大肠",4:"胃",5:"脾",6:"心",7:"小肠",8:"膀胱",9:"肾",10:"心包",11:"三焦"};
    function getHealthTip(seasonQi, zodiacOrgan) {
        let tip = "";
        if (seasonQi === "寒") tip = "🌬️ 寒邪当令，注意保暖，护肾固阳。可食温热，少外出受寒。";
        else if (seasonQi === "暑") tip = "☀️ 暑气盛行，宜清心解暑，多饮水，忌暴晒，食苦味食物。";
        else if (seasonQi === "湿") tip = "💧 湿气偏重，注意健脾祛湿，少食油腻，可饮薏米红豆水。";
        else if (seasonQi === "燥") tip = "🍂 秋燥来袭，养肺润燥，多食梨、百合，避免辛辣。";
        else tip = "🍃 风气易动，宜疏肝理气，戒躁怒，适当运动舒展筋骨。";
        tip += ` 此时当令脏腑为「${zodiacOrgan}」，可静坐调息，顺应气血流注。`;
        return tip;
    }

    // 画表盘
    let canvas, ctx;
    function drawClock(displayIdx, trueSolarHour) {
        if (!canvas) return;
        const size = canvas.width;
        ctx.clearRect(0, 0, size, size);
        ctx.save();
        ctx.translate(size/2, size/2);
        // 旋转使 0° 指向正上方（12点方向）
        ctx.rotate(-Math.PI/2);

        // 外圈
        ctx.beginPath();
        ctx.arc(0, 0, size/2-5, 0, 2*Math.PI);
        ctx.strokeStyle = "#c0b28a";
        ctx.lineWidth = 2;
        ctx.stroke();

        // 刻度和文字：每个时辰占30°，从午时（索引0）开始，角度0°对应午时
        for (let i = 0; i < 12; i++) {
            let angle = i * 30 * Math.PI/180;
            let inner = size/2 - 20;
            let outer = size/2 - 5;
            let x1 = inner * Math.cos(angle);
            let y1 = inner * Math.sin(angle);
            let x2 = outer * Math.cos(angle);
            let y2 = outer * Math.sin(angle);
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = "#a39474";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // 文字位置：半径向内一点
            let textAngle = angle;
            let r = size/2 - 28;
            let xText = r * Math.cos(textAngle);
            let yText = r * Math.sin(textAngle);
            ctx.font = `bold ${size/18}px "Segoe UI"`;
            ctx.fillStyle = "#5a4a3a";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(zodiacDisplay[i], xText, yText);
        }

        // 当前时辰高亮扇形（用显示索引）
        let startAngle = displayIdx * 30 * Math.PI/180;
        let endAngle = (displayIdx + 1) * 30 * Math.PI/180;
        ctx.beginPath();
        ctx.arc(0, 0, size/2-10, startAngle, endAngle);
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#e6b422";
        ctx.stroke();

        // 指针（指向当前时辰中央）
        let pointerAngle = (displayIdx * 30 + 15) * Math.PI/180;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        let px = (size/2 - 35) * Math.cos(pointerAngle);
        let py = (size/2 - 35) * Math.sin(pointerAngle);
        ctx.lineTo(px, py);
        ctx.strokeStyle = "#bd7a4a";
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, 6, 0, 2*Math.PI);
        ctx.fillStyle = "#bd7a4a";
        ctx.fill();
        ctx.restore();
    }

    // 更新UI
    let currentLat = null, currentLon = null;
    function updateDisplay() {
        if (currentLat === null || currentLon === null) return;
        let now = new Date();
        let utcNow = new Date(now.getTime() + now.getTimezoneOffset() * 60000);
        let trueSolar = getTrueSolarTime(currentLat, currentLon, utcNow);
        let hours = Math.floor(trueSolar);
        let minutes = Math.floor((trueSolar - hours)*60);
        let seconds = Math.floor(((trueSolar - hours)*60 - minutes)*60);
        document.getElementById('trueTime').innerHTML = `${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;

        let ss = getSunriseSunsetUTC(currentLat, currentLon, utcNow);
        let sunriseH = Math.floor(ss[0]), sunriseM = Math.floor((ss[0]%1)*60);
        let sunsetH = Math.floor(ss[1]), sunsetM = Math.floor((ss[1]%1)*60);
        document.getElementById('sunrise').innerHTML = `${sunriseH.toString().padStart(2,'0')}:${sunriseM.toString().padStart(2,'0')}`;
        document.getElementById('sunset').innerHTML = `${sunsetH.toString().padStart(2,'0')}:${sunsetM.toString().padStart(2,'0')}`;

        let sunLon = getSunLongitude(utcNow);
        let term = getSolarTermName(sunLon);
        document.getElementById('term').innerHTML = term;
        let seasonQi = getMainQi(sunLon);
        let traditionalIdx = getZodiacIndex(trueSolar);
        let displayIdx = mapToDisplayIndex(traditionalIdx);
        let organ = organMap[traditionalIdx];
        document.getElementById('dangling').innerHTML = organ;
        let tip = getHealthTip(seasonQi, organ);
        document.getElementById('dailyTip').innerHTML = `✨ ${tip}`;

        drawClock(displayIdx, trueSolar);
    }

    function setCoordinates(lat, lon, source) {
        currentLat = lat;
        currentLon = lon;
        document.getElementById('latInput').value = lat.toFixed(4);
        document.getElementById('lonInput').value = lon.toFixed(4);
        document.getElementById('sourceInfo').innerHTML = `📍 ${source} · 纬度 ${lat.toFixed(2)}° 经度 ${lon.toFixed(2)}°`;
        updateDisplay();
    }

    function requestGPS() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => setCoordinates(pos.coords.latitude, pos.coords.longitude, 'GPS自动定位'),
                () => alert('无法获取位置，请手动输入经纬度')
            );
        } else {
            alert('浏览器不支持地理定位');
        }
    }

    function manualCalculate() {
        let lat = parseFloat(document.getElementById('latInput').value);
        let lon = parseFloat(document.getElementById('lonInput').value);
        if (isNaN(lat) || isNaN(lon)) {
            alert('请输入有效的数字');
            return;
        }
        if (lat < -90 || lat > 90 || lon < -180 || lon > 180) {
            alert('纬度范围-90~90，经度范围-180~180');
            return;
        }
        setCoordinates(lat, lon, '手动输入');
    }

    // 初始化
    window.onload = () => {
        canvas = document.getElementById('clockCanvas');
        ctx = canvas.getContext('2d');
        canvas.width = 280;
        canvas.height = 280;

        document.getElementById('gpsBtn').onclick = requestGPS;
        document.getElementById('manualBtn').onclick = manualCalculate;

        // 默认使用北京天安门坐标，用户可手动修改后点击按钮
        setCoordinates(39.9042, 116.4074, '默认坐标（北京）');
        setInterval(updateDisplay, 1000);
    };
</script>
</body>
</html>
