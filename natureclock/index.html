<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>自然钟 · 时辰表盘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #e9e2d4;
            font-family: 'Segoe UI', 'Roboto', 'Noto Sans', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;

        }
        .card {
            max-width: 600px;
            width: 100%;
            background: #fffdf9;
            border-radius: 48px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: #3b5c3a;
            color: white;
            text-align: center;
            padding: 20px 16px 12px;
        }
        .header h1 {
            font-weight: 500;
            letter-spacing: 2px;
            font-size: 1.6rem;
        }
        .header p {
            font-size: 0.75rem;
            opacity: 0.8;
            margin-top: 6px;
        }
        .location-bar {
            background: #e9e2d4;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 0.8rem;
        }
        .location-bar input {
            width: 100px;
            padding: 6px 8px;
            border: none;
            border-radius: 30px;
            background: white;
            text-align: center;
        }
        .location-bar button {
            background: #3b5c3a;
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .clock-panel {
            padding: 20px;
            text-align: center;
        }
        canvas {
            width: 280px;
            height: 280px;
            margin: 0 auto;
            display: block;
            background: #fef8e7;
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .info-panel {
            padding: 16px 20px 24px;
            background: #f9f5ec;
            border-top: 1px solid #e6dfd1;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }
        .label {
            color: #6c5b4b;
            font-weight: 500;
        }
        .value {
            font-weight: 600;
            color: #3b5c3a;
        }
        .tip {
            background: #e9e2d4;
            border-radius: 28px;
            padding: 12px 16px;
            margin-top: 16px;
            font-size: 0.85rem;
            line-height: 1.4;
            color: #2e3a24;
        }
        .source-note {
            text-align: center;
            font-size: 0.7rem;
            color: #9c8a72;
            margin-top: 12px;
        }
        @media (max-width: 480px) {
            canvas {
                width: 240px;
                height: 240px;
            }
            .info-row {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <h1>🌿 自然钟</h1>
        <p>时辰 · 应天 · 养人</p>
    </div>
    <div class="location-bar">
        <span>📍</span>
        <input type="text" id="latInput" placeholder="纬度" value="">
        <input type="text" id="lonInput" placeholder="经度" value="">
        <button id="manualBtn">手动计算</button>
        <button id="gpsBtn">使用我的位置</button>
    </div>
    <div class="clock-panel">
        <canvas id="clockCanvas" width="280" height="280"></canvas>
    </div>
    <div class="info-panel">
        <div class="info-row"><span class="label">📅 公历日期</span><span class="value" id="localDate">----</span></div>
        <div class="info-row"><span class="label">🌾 干支</span><span class="value" id="ganzhi">----</span></div>
        <div class="info-row"><span class="label">🌞 真太阳时</span><span class="value" id="trueTime">--:--:--</span></div>
        <div class="info-row"><span class="label">🌅 日出</span><span class="value" id="sunrise">--:--</span></div>
        <div class="info-row"><span class="label">🌇 日落</span><span class="value" id="sunset">--:--</span></div>
        <div class="info-row"><span class="label">🍃 节气</span><span class="value" id="term">----</span></div>
        <div class="info-row"><span class="label">⚖️ 当令脏腑</span><span class="value" id="dangling">----</span></div>
        <div class="info-row"><span class="label">🐢 灵龟八法</span><span class="value" id="linggui">----</span></div>
        <div class="tip" id="dailyTip">✨ 等待定位或手动输入…</div>
        <div class="source-note" id="sourceInfo"></div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // 天文计算（基于儒略日）
    // --------------------------------------------------------------
    function toJulianDay(date) {
        let year = date.getUTCFullYear();
        let month = date.getUTCMonth() + 1;
        let day = date.getUTCDate() + date.getUTCHours()/24 + date.getUTCMinutes()/1440 + date.getUTCSeconds()/86400;
        if (month <= 2) {
            year -= 1;
            month += 12;
        }
        let A = Math.floor(year / 100);
        let B = 2 - A + Math.floor(A / 4);
        let JD = Math.floor(365.25 * (year + 4716)) + Math.floor(30.6001 * (month + 1)) + day + B - 1524.5;
        return JD;
    }

    function sunGeometricMeanLongitude(JD) {
        let T = (JD - 2451545.0) / 36525.0;
        let L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
        L0 = L0 % 360;
        if (L0 < 0) L0 += 360;
        return L0;
    }

    function sunMeanAnomaly(JD) {
        let T = (JD - 2451545.0) / 36525.0;
        let M = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
        M = M % 360;
        if (M < 0) M += 360;
        return M;
    }

    function sunEquationOfCenter(JD) {
        let T = (JD - 2451545.0) / 36525.0;
        let M = sunMeanAnomaly(JD) * Math.PI / 180;
        let C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(M);
        C += (0.019993 - 0.000101 * T) * Math.sin(2 * M);
        C += 0.000289 * Math.sin(3 * M);
        return C;
    }

    function sunTrueLongitude(JD) {
        let L0 = sunGeometricMeanLongitude(JD);
        let C = sunEquationOfCenter(JD);
        let theta = L0 + C;
        theta = theta % 360;
        if (theta < 0) theta += 360;
        return theta;
    }

    function sunApparentLongitude(JD) {
        let T = (JD - 2451545.0) / 36525.0;
        let omega = 125.04452 - 1934.136261 * T;
        let lambda = sunTrueLongitude(JD) - 0.00569 - 0.00478 * Math.sin(omega * Math.PI / 180);
        lambda = lambda % 360;
        if (lambda < 0) lambda += 360;
        return lambda;
    }

    function sunDeclination(JD) {
        let lambda = sunApparentLongitude(JD) * Math.PI / 180;
        let epsilon = 23.439291 - 0.0130042 * ((JD - 2451545.0) / 36525.0);
        epsilon = epsilon * Math.PI / 180;
        let sinDec = Math.sin(lambda) * Math.sin(epsilon);
        let dec = Math.asin(sinDec) * 180 / Math.PI;
        return dec;
    }

    function equationOfTime(JD) {
        let T = (JD - 2451545.0) / 36525.0;
        let eps = 23.439291 - 0.0130042 * T;
        eps = eps * Math.PI / 180;
        let L0 = sunGeometricMeanLongitude(JD) * Math.PI / 180;
        let M = sunMeanAnomaly(JD) * Math.PI / 180;
        let e = 0.016708634 - 0.000042037 * T - 0.0000001267 * T * T;
        let y = Math.tan(eps / 2) ** 2;
        let equation = y * Math.sin(2 * L0) - 2 * e * Math.sin(M) + 4 * e * y * Math.sin(M) * Math.cos(2 * L0)
                     - 0.5 * y * y * Math.sin(4 * L0) - 1.25 * e * e * Math.sin(2 * M);
        return equation * 4 * 180 / Math.PI;
    }

    function getSunriseSunset(lat, lon, date) {
        let utcDate = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
        let JD = toJulianDay(utcDate);
        let dec = sunDeclination(JD) * Math.PI / 180;
        let phi = lat * Math.PI / 180;
        let cosHa = (Math.sin(-0.833 * Math.PI / 180) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec));
        if (cosHa <= -1) return [0, 24];
        if (cosHa >= 1) return [0, 24];
        let Ha = Math.acos(cosHa) * 180 / Math.PI;
        let eot = equationOfTime(JD);
        let lonCorr = lon / 15;
        let noonUTC = 12 - lonCorr - eot / 60;
        let sunriseUTC = noonUTC - Ha / 15;
        let sunsetUTC = noonUTC + Ha / 15;
        sunriseUTC = (sunriseUTC % 24 + 24) % 24;
        sunsetUTC = (sunsetUTC % 24 + 24) % 24;
        let tzOffset = -new Date().getTimezoneOffset() / 60;
        let sunriseLocal = sunriseUTC + tzOffset;
        let sunsetLocal = sunsetUTC + tzOffset;
        sunriseLocal = (sunriseLocal % 24 + 24) % 24;
        sunsetLocal = (sunsetLocal % 24 + 24) % 24;
        return [sunriseLocal, sunsetLocal];
    }

    function getTrueSolarTime(lat, lon, utcDate) {
        let JD = toJulianDay(utcDate);
        let eot = equationOfTime(JD);
        let lonCorr = lon / 15;
        let noonUTC = 12 - lonCorr - eot / 60;
        let currentUTC = utcDate.getUTCHours() + utcDate.getUTCMinutes()/60 + utcDate.getUTCSeconds()/3600;
        let trueSolar = 12 + (currentUTC - noonUTC);
        trueSolar = (trueSolar % 24 + 24) % 24;
        return trueSolar;
    }

    // 节气名称（北半球顺序）
    const solarTermsNorth = ["立春","雨水","惊蛰","春分","清明","谷雨","立夏","小满","芒种","夏至","小暑","大暑",
                             "立秋","处暑","白露","秋分","寒露","霜降","立冬","小雪","大雪","冬至","小寒","大寒"];

    // 节气对称映射：北半球索引 -> 南半球索引（春分<->秋分，夏至<->冬至等）
    function getSolarTermName(sunLon, lat) {
        let lon = sunLon;
        // 南半球季节相反，将黄经偏移180°后再查节气
        if (lat < 0) {
            lon = (sunLon + 180) % 360;
        }
        let idx = Math.floor((lon + 7.5) % 360 / 15);
        return solarTermsNorth[idx % 24];
    }

    // 根据纬度和当地季节判断寒暑
    function getSeasonalQi(sunLon, lat) {
        // 计算当地太阳黄经（南半球偏移180°）
        let localLon = sunLon;
        if (lat < 0) localLon = (sunLon + 180) % 360;

        // 判断当地季节
        let isSummer = false;
        let isWinter = false;
        // 夏季：黄经45°～135°；冬季：225°～315°
        if (localLon >= 45 && localLon < 135) isSummer = true;
        else if (localLon >= 225 && localLon < 315) isWinter = true;

        let absLat = Math.abs(lat);
        // 热带 (|lat| < 23.5°)
        if (absLat < 23.5) {
            return "暑";
        }
        // 寒带 (|lat| > 66.5°)
        if (absLat > 66.5) {
            return "寒";
        }
        // 温带：根据季节
        if (isSummer) return "暑";
        if (isWinter) return "寒";
        return "温";
    }

    // 养生建议
    function getHealthTipBySeason(seasonQi, zodiacOrgan) {
        let tip = "";
        if (seasonQi === "寒") tip = "🌬️ 寒邪当令，注意保暖，护肾固阳。可食温热，少外出受寒。";
        else if (seasonQi === "暑") tip = "☀️ 暑气盛行，宜清心解暑，多饮水，忌暴晒，食苦味食物。";
        else tip = "🍃 气候温和，注意平衡饮食，顺应自然起居。";
        tip += ` 此时当令脏腑为「${zodiacOrgan}」，可静坐调息，顺应气血流注。`;
        return tip;
    }

    // ---------- 干支计算 ----------
    const gan = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
    const zhi = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];

    const liuShiJiaZi = [
        "甲子","乙丑","丙寅","丁卯","戊辰","己巳","庚午","辛未","壬申","癸酉",
        "甲戌","乙亥","丙子","丁丑","戊寅","己卯","庚辰","辛巳","壬午","癸未",
        "甲申","乙酉","丙戌","丁亥","戊子","己丑","庚寅","辛卯","壬辰","癸巳",
        "甲午","乙未","丙申","丁酉","戊戌","己亥","庚子","辛丑","壬寅","癸卯",
        "甲辰","乙巳","丙午","丁未","戊申","己酉","庚戌","辛亥","壬子","癸丑",
        "甲寅","乙卯","丙辰","丁巳","戊午","己未","庚申","辛酉","壬戌","癸亥"
    ];

    function getYearGanZhi(year) {
        let idx = (year - 4) % 60;
        if (idx < 0) idx += 60;
        return liuShiJiaZi[idx];
    }

    // 根据太阳黄经确定月支索引（立春315°为寅月0，每30°递进一个地支）
    function getMonthZhiIndex(sunLon) {
        // 黄经范围 0~360
        let lon = sunLon % 360;
        // 立春315° ~ 345° 为寅月（索引0），雨水345°~15° 仍为寅？不，应该按节气交接时刻：黄经315°立春，下一节气雨水345°为寅月结束？更准确的是，每个地支对应两个节气，取起始节气黄经。
        // 寅月：立春（315°）~ 惊蛰（345°）
        // 卯月：惊蛰（345°）~ 清明（15°）
        // 辰月：清明（15°）~ 立夏（45°）
        // ...
        // 为简化，使用起始节气判断：太阳黄经在 [315,345) 为寅月，[345,15) 为卯月？注意360/0边界。
        // 更简单：用公式 (floor((lon + 360 - 315) / 30) % 12) 但需处理跨越360°。
        let offset = (lon - 315 + 360) % 360;
        let idx = Math.floor(offset / 30) % 12;
        return idx;
    }

    function getMonthGanZhi(yearGan, sunLon) {
        let monthZhiIdx = getMonthZhiIndex(sunLon);
        // 五虎遁：甲己之年丙作首，乙庚之岁戊为头，丙辛必定寻庚起，丁壬壬位顺行流，戊癸甲寅之上求。
        let start = {甲:0, 乙:2, 丙:4, 丁:6, 戊:8, 己:0, 庚:2, 辛:4, 壬:6, 癸:8}[yearGan];
        let ganIdx = (start + monthZhiIdx) % 10;
        return gan[ganIdx] + zhi[monthZhiIdx];
    }

    function getDayGanZhi(date) {
        let year = date.getFullYear();
        let month = date.getMonth() + 1;
        let day = date.getDate();
        let C = Math.floor(year / 100);
        let Y = year % 100;
        let M = month;
        if (M === 1 || M === 2) {
            M += 12;
            Y -= 1;
        }
        let D = Math.floor((C/4 - 2*C + Y + Y/4 + 13*(M+1)/5 + day - 1) % 60);
        if (D < 0) D += 60;
        return liuShiJiaZi[D];
    }

    function getHourGanZhi(dayGan, trueSolarHour) {
        let zhiIdx = Math.floor((trueSolarHour + 1) / 2) % 12;
        let start = {甲:0,乙:2,丙:4,丁:6,戊:8,己:0,庚:2,辛:4,壬:6,癸:8}[dayGan];
        let ganIdx = (start + zhiIdx) % 10;
        return gan[ganIdx] + zhi[zhiIdx];
    }

    function getHourZhiIndex(trueSolarHour) {
        return Math.floor((trueSolarHour + 1) / 2) % 12;
    }

    function getHourZhiName(trueSolarHour) {
        return zhi[getHourZhiIndex(trueSolarHour)];
    }

    function getGanZhiDisplay(date, trueSolarHour, sunLon) {
        let year = date.getFullYear();
        let yearGZ = getYearGanZhi(year);
        let yearGan = yearGZ[0];
        let monthGZ = getMonthGanZhi(yearGan, sunLon);
        let dayGZ = getDayGanZhi(date);
        let dayGan = dayGZ[0];
        let hourGZ = getHourGanZhi(dayGan, trueSolarHour);
        let hourZhi = getHourZhiName(trueSolarHour);
        return `${yearGZ}年 ${monthGZ}月 ${dayGZ}日 ${hourGZ}时 (${hourZhi}时)`;
    }

    // 灵龟八法
    function getLingGuiPoint(date, trueSolarHour) {
        let dayGZ = getDayGanZhi(date);
        let dayIdx = liuShiJiaZi.indexOf(dayGZ) + 1;
        let hourZhiIdx = getHourZhiIndex(trueSolarHour);
        let hourSeq = hourZhiIdx + 1;
        let sum = dayIdx + hourSeq;
        let mod = sum % 9;
        if (mod === 0) mod = 9;
        const pointMap = {1:"公孙",2:"内关",3:"足临泣",4:"外关",5:"后溪",6:"申脉",7:"列缺",8:"照海",9:"照海"};
        return pointMap[mod];
    }

    // 时辰相关
    const traditionalZodiac = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
    const zodiacDisplay = ["午","未","申","酉","戌","亥","子","丑","寅","卯","辰","巳"];

    function getZodiacIndex(trueSolarHour) {
        let h = (trueSolarHour + 1) % 24;
        return Math.floor(h / 2) % 12;
    }

    function mapToDisplayIndex(traditionalIdx) {
        return (traditionalIdx + 6) % 12;
    }

    const organMap = {0:"胆",1:"肝",2:"肺",3:"大肠",4:"胃",5:"脾",6:"心",7:"小肠",8:"膀胱",9:"肾",10:"心包",11:"三焦"};

    // 画表盘
    let canvas, ctx;
    function drawClock(displayIdx) {
        if (!canvas) return;
        const size = canvas.width;
        ctx.clearRect(0, 0, size, size);
        ctx.save();
        ctx.translate(size/2, size/2);
        ctx.rotate(-Math.PI/2);

        // 外圈
        ctx.beginPath();
        ctx.arc(0, 0, size/2-5, 0, 2*Math.PI);
        ctx.strokeStyle = "#c0b28a";
        ctx.lineWidth = 2;
        ctx.stroke();

        // 刻度和文字
        for (let i = 0; i < 12; i++) {
            let angle = i * 30 * Math.PI/180;
            let inner = size/2 - 20;
            let outer = size/2 - 5;
            let x1 = inner * Math.cos(angle);
            let y1 = inner * Math.sin(angle);
            let x2 = outer * Math.cos(angle);
            let y2 = outer * Math.sin(angle);
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = "#a39474";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            let r = size/2 - 32;
            let xText = r * Math.cos(angle);
            let yText = r * Math.sin(angle);

            ctx.save();
            ctx.translate(xText, yText);
            ctx.rotate(Math.PI/2);
            ctx.font = `bold ${size/18}px "Segoe UI"`;
            ctx.fillStyle = "#5a4a3a";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(zodiacDisplay[i], 0, 0);
            ctx.restore();
        }

        // 高亮当前时辰扇形
        let startAngle = displayIdx * 30 * Math.PI/180;
        let endAngle = (displayIdx + 1) * 30 * Math.PI/180;
        ctx.beginPath();
        ctx.arc(0, 0, size/2-10, startAngle, endAngle);
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#e6b422";
        ctx.stroke();

        // 指针
        let pointerAngle = (displayIdx * 30 + 15) * Math.PI/180;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        let px = (size/2 - 35) * Math.cos(pointerAngle);
        let py = (size/2 - 35) * Math.sin(pointerAngle);
        ctx.lineTo(px, py);
        ctx.strokeStyle = "#bd7a4a";
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, 6, 0, 2*Math.PI);
        ctx.fillStyle = "#bd7a4a";
        ctx.fill();
        ctx.restore();
    }

    // 全局变量
    let currentLat = null, currentLon = null;

    function updateDisplay() {
        if (currentLat === null || currentLon === null) return;

        const now = new Date();
        const JD = toJulianDay(now);
        const sunLon = sunApparentLongitude(JD);

        // 显示本地日期
        let localDate = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
        let dateStr = `${localDate.getFullYear()}-${(localDate.getMonth()+1).toString().padStart(2,'0')}-${localDate.getDate().toString().padStart(2,'0')}`;
        document.getElementById('localDate').innerHTML = dateStr;

        // 真太阳时
        let trueSolar = getTrueSolarTime(currentLat, currentLon, now);
        let hours = Math.floor(trueSolar);
        let minutes = Math.floor((trueSolar - hours)*60);
        let seconds = Math.floor(((trueSolar - hours)*60 - minutes)*60);
        document.getElementById('trueTime').innerHTML = `${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;

        // 日出日落
        let localDateForSun = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        let [sunrise, sunset] = getSunriseSunset(currentLat, currentLon, localDateForSun);
        let sunriseH = Math.floor(sunrise), sunriseM = Math.floor((sunrise%1)*60);
        let sunsetH = Math.floor(sunset), sunsetM = Math.floor((sunset%1)*60);
        document.getElementById('sunrise').innerHTML = `${sunriseH.toString().padStart(2,'0')}:${sunriseM.toString().padStart(2,'0')}`;
        document.getElementById('sunset').innerHTML = `${sunsetH.toString().padStart(2,'0')}:${sunsetM.toString().padStart(2,'0')}`;

        // 节气（南半球自动翻转）
        let term = getSolarTermName(sunLon, currentLat);
        document.getElementById('term').innerHTML = term;

        // 当令脏腑
        let traditionalIdx = getZodiacIndex(trueSolar);
        let displayIdx = mapToDisplayIndex(traditionalIdx);
        let organ = organMap[traditionalIdx];
        document.getElementById('dangling').innerHTML = organ;

        // 寒暑（基于纬度和季节）
        let seasonQi = getSeasonalQi(sunLon, currentLat);
        let tip = getHealthTipBySeason(seasonQi, organ);
        document.getElementById('dailyTip').innerHTML = `✨ ${tip}`;

        // 干支显示（传入太阳黄经）
        let ganzhi = getGanZhiDisplay(localDate, trueSolar, sunLon);
        document.getElementById('ganzhi').innerHTML = ganzhi;

        // 灵龟八法
        let lingGuiPoint = getLingGuiPoint(localDate, trueSolar);
        document.getElementById('linggui').innerHTML = `${lingGuiPoint} (开穴)`;

        drawClock(displayIdx);
    }

    function setCoordinates(lat, lon, source) {
        currentLat = lat;
        currentLon = lon;
        document.getElementById('latInput').value = lat.toFixed(4);
        document.getElementById('lonInput').value = lon.toFixed(4);
        document.getElementById('sourceInfo').innerHTML = `📍 ${source} · 纬度 ${lat.toFixed(2)}° 经度 ${lon.toFixed(2)}°`;
        updateDisplay();
    }

    function requestGPS() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => setCoordinates(pos.coords.latitude, pos.coords.longitude, 'GPS自动定位'),
                () => alert('无法获取位置，请手动输入经纬度')
            );
        } else {
            alert('浏览器不支持地理定位');
        }
    }

    function manualCalculate() {
        let lat = parseFloat(document.getElementById('latInput').value);
        let lon = parseFloat(document.getElementById('lonInput').value);
        if (isNaN(lat) || isNaN(lon)) {
            alert('请输入有效的数字');
            return;
        }
        if (lat < -90 || lat > 90 || lon < -180 || lon > 180) {
            alert('纬度范围-90~90，经度范围-180~180');
            return;
        }
        setCoordinates(lat, lon, '手动输入');
    }

    // 初始化
    window.onload = () => {
        canvas = document.getElementById('clockCanvas');
        ctx = canvas.getContext('2d');
        canvas.width = 280;
        canvas.height = 280;

        document.getElementById('gpsBtn').onclick = requestGPS;
        document.getElementById('manualBtn').onclick = manualCalculate;

        // 默认坐标（北京）
        setCoordinates(39.9042, 116.4074, '默认坐标（北京）');
        setInterval(updateDisplay, 1000);
    };
</script>
</body>
</html>
