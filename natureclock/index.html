<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>自然钟 · 人生轨迹 · 地貌修正气候</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #e9e2d4;
            font-family: 'Segoe UI', 'Roboto', 'Noto Sans', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;

        }
        .card {
            max-width: 800px;

        }

            background: #3b5c3a;
            color: white;
            text-align: center;
            padding: 20px 16px 12px;
        }
        .header h1 { font-weight: 500; letter-spacing: 2px; font-size: 1.6rem; }
        .header p { font-size: 0.75rem; opacity: 0.8; margin-top: 6px; }
        .location-bar {
            background: #e9e2d4;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 0.8rem;

        canvas {
            width: 280px; height: 280px;
            margin: 0 auto; display: block;
            background: #fef8e7;
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .info-panel {
            padding: 16px 20px 24px;
            background: #f9f5ec;
            border-top: 1px solid #e6dfd1;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }
        .label { color: #6c5b4b; font-weight: 500; }
        .value { font-weight: 600; color: #3b5c3a; }
        .tip {
            background: #e9e2d4;
            border-radius: 28px;
            padding: 12px 16px;

            color: #2e3a24;
        }
        .source-note { text-align: center; font-size: 0.7rem; color: #9c8a72; margin-top: 12px; }
        .section-card {
            background: #f0ede4;
            border-radius: 32px;
            padding: 16px;
            margin-top: 20px;
            border: 1px solid #e0d6c8;
        }
        .section-card h3 { font-size: 1rem; margin-bottom: 12px; color: #3b5c3a; text-align: center; }
        .event-item {
            background: white;
            border-radius: 24px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .event-item input {
            padding: 6px 8px;
            border-radius: 30px;
            border: 1px solid #ccc;
            flex: 1;
            min-width: 100px;
        }
        .event-item button { background: #8b7a62; padding: 6px 12px; font-size: 0.7rem; }
        .btn-primary {
            background: #3b5c3a; border: none; color: white; padding: 10px 16px;
            border-radius: 40px; cursor: pointer; font-size: 0.85rem; margin-top: 8px; width: 100%;
        }
        .btn-secondary {
            background: #6b8c6a; border: none; color: white; padding: 10px 16px;
            border-radius: 40px; cursor: pointer; font-size: 0.85rem; margin-top: 8px; width: 100%;
        }
        .btn-download { background: #8b7a62; }
        .report-area {
            background: #fff8ef;
            border-radius: 24px;
            padding: 12px;
            margin-top: 16px;
            font-size: 0.85rem;
            line-height: 1.5;
            border: 1px dashed #b8aa8e;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .flex-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }
        .flex-row label { font-size: 0.8rem; color: #6c5b4b; width: 50px; }
        .flex-row input { flex: 1; padding: 6px 8px; border-radius: 30px; border: 1px solid #ccc; }
        @media (max-width: 480px) { canvas { width: 240px; height: 240px; } .info-row { font-size: 0.8rem; } }

<body>
<div class="card">
    <div class="header">
        <h1>🌿 自然钟 · 人生轨迹</h1>
        <p>时辰 | 地貌修正 | 气候应脏腑 | 观己</p>
    </div>
    <div class="location-bar">
        <span>📍 当前位置</span>
        <input type="text" id="latInput" placeholder="纬度" value="">
        <input type="text" id="lonInput" placeholder="经度" value="">
        <button id="manualBtn">手动计算</button>
        <button id="gpsBtn">使用我的位置</button>
    </div>
    <div class="clock-panel">
        <canvas id="clockCanvas" width="280" height="280"></canvas>
    </div>
    <div class="info-panel">
        <div class="info-row"><span class="label">📅 日期</span><span class="value" id="localDate">----</span></div>
        <div class="info-row"><span class="label">🌞 真太阳时</span><span class="value" id="trueTime">--:--:--</span></div>
        <div class="info-row"><span class="label">🌅 日出</span><span class="value" id="sunrise">--:--</span></div>
        <div class="info-row"><span class="label">🌇 日落</span><span class="value" id="sunset">--:--</span></div>
        <div class="info-row"><span class="label">🌞 太阳黄经</span><span class="value" id="sunLongitude">---°</span></div>
        <div class="info-row"><span class="label">🍃 节气</span><span class="value" id="term">----</span></div>
        <div class="info-row"><span class="label">🏞️ 地貌类型</span><span class="value" id="terrainType">----</span></div>
        <div class="info-row"><span class="label">🌿 实际气候</span><span class="value" id="actualQi">----</span></div>
        <div class="info-row"><span class="label">⚕️ 气候应脏腑</span><span class="value" id="climateOrgan">----</span></div>
        <div class="info-row"><span class="label">⏰ 时辰当令脏腑</span><span class="value" id="dangling">----</span></div>
        <div class="tip" id="dailyTip">✨ 等待定位或手动输入…</div>
        <div class="source-note" id="sourceInfo"></div>

        <!-- 出生信息 -->
        <div class="section-card">
            <h3>🎂 先天禀赋 · 出生信息</h3>
            <div class="flex-row">
                <label>日期</label><input type="date" id="birthDate" value="1990-03-21">
                <label>时间</label><input type="time" id="birthTime" value="12:00">
            </div>
            <div class="flex-row">
                <label>纬度</label><input type="text" id="birthLat" placeholder="纬度" value="39.9042">
                <label>经度</label><input type="text" id="birthLon" placeholder="经度" value="116.4074">
            </div>
            <button id="analyzeBirthBtn" class="btn-primary">🔮 分析先天禀赋</button>
        </div>

        <!-- 人生轨迹 · 事件记录 -->
        <div class="section-card">
            <h3>📌 人生轨迹 · 大事件</h3>
            <div id="eventList"></div>
            <button id="addEventBtn" class="btn-secondary">➕ 添加事件</button>
            <button id="analyzeTrajectoryBtn" class="btn-primary" style="margin-top:8px;">🔄 分析人生轨迹</button>
            <button id="downloadTrajectoryBtn" class="btn-secondary btn-download">📥 下载事件报告</button>
            <div id="trajectoryReport" class="report-area">点击「分析人生轨迹」查看您的时空变迁与脏腑演化。</div>
        </div>
    </div>
</div>

<script>
    // ========== 天文计算 ==========
    function toJulianDay(date) {
        let year = date.getUTCFullYear();
        let month = date.getUTCMonth() + 1;
        let day = date.getUTCDate() + date.getUTCHours()/24 + date.getUTCMinutes()/1440 + date.getUTCSeconds()/86400;
        if (month <= 2) { year--; month += 12; }
        let A = Math.floor(year / 100);
        let B = 2 - A + Math.floor(A / 4);
        let JD = Math.floor(365.25 * (year + 4716)) + Math.floor(30.6001 * (month + 1)) + day + B - 1524.5;
        return JD;
    }

    function sunApparentLongitude(JD) {
        let T = (JD - 2451545.0) / 36525.0;
        let L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
        L0 = L0 % 360; if (L0 < 0) L0 += 360;
        let M = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
        M = M % 360; if (M < 0) M += 360;
        let Mrad = M * Math.PI / 180;
        let C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(Mrad);
        C += (0.019993 - 0.000101 * T) * Math.sin(2 * Mrad);
        C += 0.000289 * Math.sin(3 * Mrad);
        let theta = L0 + C;
        theta = theta % 360; if (theta < 0) theta += 360;
        let omega = 125.04452 - 1934.136261 * T;
        let lambda = theta - 0.00569 - 0.00478 * Math.sin(omega * Math.PI / 180);
        lambda = lambda % 360; if (lambda < 0) lambda += 360;
        return lambda;
    }

    function getSolarTermName(JD) {
        let lambda = sunApparentLongitude(JD);
        const terms = ["春分","清明","谷雨","立夏","小满","芒种","夏至","小暑","大暑","立秋","处暑","白露","秋分","寒露","霜降","立冬","小雪","大雪","冬至","小寒","大寒","立春","雨水","惊蛰"];
        let idx = Math.floor((lambda + 7.5) % 360 / 15);
        return terms[idx % 24];
    }

    function getBaseQiFromSunLon(sunLon) {
        if ((sunLon >= 315) || (sunLon < 45)) return "寒";
        if (sunLon >= 45 && sunLon < 135) return "暑";
        if (sunLon >= 135 && sunLon < 225) return "湿";
        if (sunLon >= 225 && sunLon < 315) return "燥";
        return "风";
    }

    // 地形判断（基于经纬度 + 海拔估算，此处使用简化版，可扩展真实高程数据）
    function getTerrainType(lat, lon) {
        // 四川盆地：28~32°N, 102~108°E
        if (lat > 28 && lat < 32 && lon > 102 && lon < 108) return "盆地";
        // 青藏高原（粗略）：北纬25~40，东经75~105，且海拔高（这里模拟）
        if (lat > 25 && lat < 40 && lon > 75 && lon < 105) return "高原";
        // 沿海：经度>115 且纬度在18~45之间（中国东部沿海大致）
        if (lon > 115 && lat > 18 && lat < 45) return "沿海";
        // 内陆其他
        return "内陆";
    }

    // 地貌修正气候
    function adjustQiWithTerrain(baseQi, terrain) {
        if (terrain === "盆地") {
            if (baseQi === "寒") return "寒湿";
            if (baseQi === "暑") return "暑湿";
            if (baseQi === "燥") return "湿";
            if (baseQi === "风") return "湿";
            return "湿";
        }
        if (terrain === "高原") {
            if (baseQi === "暑") return "凉";
            if (baseQi === "湿") return "寒湿";
            if (baseQi === "燥") return "寒燥";
            return "寒";
        }
        if (terrain === "沿海") {
            if (baseQi === "寒") return "寒湿";
            if (baseQi === "暑") return "暑湿";
            if (baseQi === "燥") return "湿";
            return "湿";
        }
        return baseQi;
    }

    const qiToOrgan = {
        "寒": "肾", "暑": "心", "燥": "肺", "湿": "脾", "风": "肝",
        "寒湿": "肾脾", "暑湿": "心脾", "寒燥": "肺肾", "凉": "肺"
    };

    function getActualQiAndOrgan(lat, lon, sunLon) {
        let baseQi = getBaseQiFromSunLon(sunLon);
        let terrain = getTerrainType(lat, lon);
        let actualQi = adjustQiWithTerrain(baseQi, terrain);
        let organ = qiToOrgan[actualQi] || qiToOrgan[baseQi] || "脾";
        return { baseQi, terrain, actualQi, organ };
    }

    // 日出日落计算（精确）
    function getSunriseSunset(lat, lon, date) {
        let utcDate = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
        let JD = toJulianDay(utcDate);
        let T = (JD - 2451545.0) / 36525.0;
        let L0 = (280.46646 + 36000.76983 * T + 0.0003032 * T * T) * Math.PI / 180;
        let M = (357.52911 + 35999.05029 * T - 0.0001537 * T * T) * Math.PI / 180;
        let e = 0.016708634 - 0.000042037 * T - 0.0000001267 * T * T;
        let C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(M) + (0.019993 - 0.000101 * T) * Math.sin(2*M) + 0.000289 * Math.sin(3*M);
        let theta = L0 + C;
        let omega = 125.04452 - 1934.136261 * T;
        let lambda = theta - 0.00569 - 0.00478 * Math.sin(omega);
        let epsilon = (23.439291 - 0.0130042 * T) * Math.PI / 180;
        let dec = Math.asin(Math.sin(lambda) * Math.sin(epsilon));
        let phi = lat * Math.PI / 180;
        let cosHa = (Math.sin(-0.833 * Math.PI / 180) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec));
        if (cosHa <= -1) return [0, 24];
        if (cosHa >= 1) return [0, 24];
        let Ha = Math.acos(cosHa);
        let eot = (0.000075 + 0.001868 * Math.cos(M) - 0.032077 * Math.sin(M) - 0.014615 * Math.cos(2*M) - 0.04089 * Math.sin(2*M)) * 229.18;
        let lonCorr = lon / 15;
        let noonUTC = 12 - lonCorr - eot/60;
        let sunriseUTC = noonUTC - Ha * 12 / Math.PI;
        let sunsetUTC = noonUTC + Ha * 12 / Math.PI;
        sunriseUTC = (sunriseUTC % 24 + 24) % 24;
        sunsetUTC = (sunsetUTC % 24 + 24) % 24;
        let tzOffset = -new Date().getTimezoneOffset() / 60;
        return [sunriseUTC + tzOffset, sunsetUTC + tzOffset];
    }

    function getTrueSolarTime(lat, lon, utcDate) {
        let JD = toJulianDay(utcDate);
        let T = (JD - 2451545.0) / 36525.0;
        let eot = (0.000075 + 0.001868 * Math.cos(2*Math.PI*(JD-2451545.0)/365.25) - 0.032077 * Math.sin(2*Math.PI*(JD-2451545.0)/365.25) - 0.014615 * Math.cos(4*Math.PI*(JD-2451545.0)/365.25) - 0.04089 * Math.sin(4*Math.PI*(JD-2451545.0)/365.25)) * 229.18;
        let lonCorr = lon / 15;
        let noonUTC = 12 - lonCorr - eot/60;
        let currentUTC = utcDate.getUTCHours() + utcDate.getUTCMinutes()/60 + utcDate.getUTCSeconds()/3600;
        let trueSolar = 12 + (currentUTC - noonUTC);
        return (trueSolar % 24 + 24) % 24;
    }

    const organMap = {0:"胆",1:"肝",2:"肺",3:"大肠",4:"胃",5:"脾",6:"心",7:"小肠",8:"膀胱",9:"肾",10:"心包",11:"三焦"};
    function getZodiacIndex(trueSolarHour) { let h = (trueSolarHour + 1) % 24; return Math.floor(h / 2) % 12; }

    // 禀赋计算（带地貌修正）
    function computeConstitutionAt(jd, lat, lon) {
        let sunLon = sunApparentLongitude(jd);
        let { baseQi, terrain, actualQi, organ: climateOrgan } = getActualQiAndOrgan(lat, lon, sunLon);
        let trueSolar = getTrueSolarTime(lat, lon, new Date(jd * 86400000));
        let zodiacIdx = getZodiacIndex(trueSolar);
        let zodiacOrgan = organMap[zodiacIdx];
        let constitution = {肝:0,心:0,脾:0,肺:0,肾:0};
        // 气候影响
        let mainOrgan = climateOrgan.split('')[0];
        if (mainOrgan && constitution[mainOrgan] !== undefined) constitution[mainOrgan] += 1;
        // 时辰影响
        constitution[zodiacOrgan] += 0.5;
        // 太阳黄经影响
        if (sunLon >= 0 && sunLon < 90) constitution["心"] += 0.3;
        else if (sunLon >= 90 && sunLon < 180) constitution["脾"] += 0.3;
        else if (sunLon >= 180 && sunLon < 270) constitution["肺"] += 0.3;
        else constitution["肾"] += 0.3;
        let absLat = Math.abs(lat);
        if (absLat > 45) constitution["肾"] += 0.4;
        else if (absLat < 23.5) constitution["心"] += 0.4;
        else constitution["脾"] += 0.2;
        let sorted = Object.entries(constitution).sort((a,b)=>b[1]-a[1]);
        return { constitution, strongest: sorted[0][0], weakest: sorted[3][0], actualQi, climateOrgan, zodiacOrgan, sunLon, terrain };
    }

    // 全局变量
    let currentLat = null, currentLon = null;
    let canvas, ctx;
    let events = [];
    let lastReport = "";

    // 更新当前时钟显示
    function updateDisplay() {
        if (currentLat === null || currentLon === null) return;
        const now = new Date();
        const JD = toJulianDay(now);
        let sunLon = sunApparentLongitude(JD);
        let { terrain, actualQi, organ: climateOrgan } = getActualQiAndOrgan(currentLat, currentLon, sunLon);
        document.getElementById('terrainType').innerHTML = terrain;
        document.getElementById('actualQi').innerHTML = actualQi;
        document.getElementById('climateOrgan').innerHTML = climateOrgan;

        let trueSolar = getTrueSolarTime(currentLat, currentLon, now);
        let zodiacIdx = getZodiacIndex(trueSolar);
        document.getElementById('dangling').innerHTML = organMap[zodiacIdx];

        let localDate = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
        document.getElementById('localDate').innerHTML = `${localDate.getFullYear()}-${(localDate.getMonth()+1).toString().padStart(2,'0')}-${localDate.getDate().toString().padStart(2,'0')}`;
        let h = Math.floor(trueSolar), m = Math.floor((trueSolar-h)*60), s = Math.floor(((trueSolar-h)*60 - m)*60);
        document.getElementById('trueTime').innerHTML = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        document.getElementById('sunLongitude').innerHTML = sunLon.toFixed(1) + '°';
        document.getElementById('term').innerHTML = getSolarTermName(JD);

        let [sunrise, sunset] = getSunriseSunset(currentLat, currentLon, new Date(now.getFullYear(), now.getMonth(), now.getDate()));
        document.getElementById('sunrise').innerHTML = `${Math.floor(sunrise).toString().padStart(2,'0')}:${Math.floor((sunrise%1)*60).toString().padStart(2,'0')}`;
        document.getElementById('sunset').innerHTML = `${Math.floor(sunset).toString().padStart(2,'0')}:${Math.floor((sunset%1)*60).toString().padStart(2,'0')}`;

        let tip = `地貌：${terrain}，实际气候：${actualQi} → 宜调「${climateOrgan}」；时辰当令「${organMap[zodiacIdx]}」。`;
        document.getElementById('dailyTip').innerHTML = `✨ ${tip}`;
        drawClock(zodiacIdx);
    }

    function drawClock(traditionalIdx) {
        if (!canvas) return;
        const size = canvas.width;
        ctx.clearRect(0,0,size,size);
        ctx.save();
        ctx.translate(size/2, size/2);
        ctx.rotate(-Math.PI/2);
        const zodiacDisplay = ["午","未","申","酉","戌","亥","子","丑","寅","卯","辰","巳"];
        for (let i=0; i<12; i++) {
            let angle = i*30*Math.PI/180;
            let x1=(size/2-20)*Math.cos(angle), y1=(size/2-20)*Math.sin(angle);
            let x2=(size/2-5)*Math.cos(angle), y2=(size/2-5)*Math.sin(angle);
            ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
            let r=size/2-32, x=r*Math.cos(angle), y=r*Math.sin(angle);
            ctx.save(); ctx.translate(x,y); ctx.rotate(Math.PI/2);
            ctx.font = `bold ${size/18}px "Segoe UI"`; ctx.fillStyle="#5a4a3a";
            ctx.textAlign="center"; ctx.textBaseline="middle";
            ctx.fillText(zodiacDisplay[i],0,0); ctx.restore();
        }
        let displayIdx = (traditionalIdx + 6) % 12;
        let start = displayIdx*30*Math.PI/180, end = (displayIdx+1)*30*Math.PI/180;
        ctx.beginPath(); ctx.arc(0,0,size/2-10,start,end); ctx.lineWidth=4; ctx.strokeStyle="#e6b422"; ctx.stroke();
        let pointer = (displayIdx*30+15)*Math.PI/180;
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo((size/2-35)*Math.cos(pointer),(size/2-35)*Math.sin(pointer)); ctx.stroke();
        ctx.beginPath(); ctx.arc(0,0,6,0,2*Math.PI); ctx.fillStyle="#bd7a4a"; ctx.fill();
        ctx.restore();
    }

    function setCoordinates(lat, lon, source) {
        currentLat = lat; currentLon = lon;
        document.getElementById('latInput').value = lat.toFixed(4);
        document.getElementById('lonInput').value = lon.toFixed(4);
        document.getElementById('sourceInfo').innerHTML = `📍 ${source} · 纬度 ${lat.toFixed(2)}° 经度 ${lon.toFixed(2)}°`;
        updateDisplay();
    }
    function requestGPS() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => setCoordinates(pos.coords.latitude, pos.coords.longitude, 'GPS自动定位'),
                () => alert('无法获取位置，请手动输入经纬度')
            );
        } else alert('浏览器不支持地理定位');
    }
    function manualCalculate() {
        let lat = parseFloat(document.getElementById('latInput').value);
        let lon = parseFloat(document.getElementById('lonInput').value);
        if (isNaN(lat)||isNaN(lon)) { alert('请输入有效数字'); return; }
        setCoordinates(lat, lon, '手动输入');
    }

    // 事件管理
    function renderEvents() {
        let container = document.getElementById('eventList');
        container.innerHTML = '';
        events.forEach((ev, idx) => {
            let div = document.createElement('div');
            div.className = 'event-item';
            div.innerHTML = `
                <input type="text" value="${ev.name}" data-idx="${idx}" data-field="name" style="flex:1.5">
                <input type="date" value="${ev.dateStr}" data-idx="${idx}" data-field="dateStr" style="flex:1">
                <input type="text" value="${ev.lat}" data-idx="${idx}" data-field="lat" style="width:90px">
                <input type="text" value="${ev.lon}" data-idx="${idx}" data-field="lon" style="width:90px">
                <button data-idx="${idx}" class="remove-event">❌</button>
            `;
            container.appendChild(div);
        });
        document.querySelectorAll('.event-item input').forEach(inp => {
            inp.addEventListener('change', (e) => {
                let idx = parseInt(e.target.dataset.idx);
                let field = e.target.dataset.field;
                if (!isNaN(idx) && events[idx]) events[idx][field] = e.target.value;
            });
        });
        document.querySelectorAll('.remove-event').forEach(btn => {
            btn.addEventListener('click', (e) => {
                let idx = parseInt(e.target.dataset.idx);
                if (!isNaN(idx)) { events.splice(idx,1); renderEvents(); }
            });
        });
    }
    function addEvent() {
        events.push({ name: "新事件", dateStr: "2000-01-01", lat: "39.9042", lon: "116.4074" });
        renderEvents();
    }

    function analyzeBirth() {
        let birthDateStr = document.getElementById('birthDate').value;
        let birthTimeStr = document.getElementById('birthTime').value;
        let birthLat = parseFloat(document.getElementById('birthLat').value);
        let birthLon = parseFloat(document.getElementById('birthLon').value);
        if (isNaN(birthLat)||isNaN(birthLon)) { alert('出生地经纬度无效'); return; }
        let birthDateTime = new Date(birthDateStr + 'T' + birthTimeStr + ':00');
        if (isNaN(birthDateTime)) { alert('出生日期无效'); return; }
        let birthUTC = new Date(birthDateTime.getTime() - birthDateTime.getTimezoneOffset()*60000);
        let birthJD = toJulianDay(birthUTC);
        let consti = computeConstitutionAt(birthJD, birthLat, birthLon);
        let report = `【先天禀赋】\n出生：${birthDateStr} ${birthTimeStr}\n地点：${birthLat.toFixed(2)}°, ${birthLon.toFixed(2)}°\n太阳黄经：${consti.sunLon.toFixed(1)}°（${getSolarTermName(birthJD)}）\n地貌：${consti.terrain}\n实际气候：${consti.actualQi} → 气候应脏腑：${consti.climateOrgan}\n时辰当令脏腑：${consti.zodiacOrgan}\n\n五脏相对值：肝${consti.constitution.肝.toFixed(1)} 心${consti.constitution.心.toFixed(1)} 脾${consti.constitution.脾.toFixed(1)} 肺${consti.constitution.肺.toFixed(1)} 肾${consti.constitution.肾.toFixed(1)}\n最强者：${consti.strongest}，最弱者：${consti.weakest}\n`;
        document.getElementById('trajectoryReport').innerHTML = report.replace(/\n/g,'<br>');
        lastReport = report;
    }

    function analyzeTrajectory() {
        if (events.length === 0) { document.getElementById('trajectoryReport').innerHTML = '暂无事件，请添加。'; return; }
        let sorted = [...events].sort((a,b)=> (a.dateStr||'') < (b.dateStr||'') ? -1 : 1);
        let report = `【人生轨迹 · 时空演化】\n\n`;
        for (let ev of sorted) {
            let dateObj = new Date(ev.dateStr);
            if (isNaN(dateObj)) continue;
            let utcDate = new Date(dateObj.getTime() - dateObj.getTimezoneOffset()*60000);
            let jd = toJulianDay(utcDate);
            let lat = parseFloat(ev.lat), lon = parseFloat(ev.lon);
            if (isNaN(lat)||isNaN(lon)) continue;
            let consti = computeConstitutionAt(jd, lat, lon);
            report += `📌 ${ev.name}（${ev.dateStr}）\n`;
            report += `   地点：${lat.toFixed(2)}°, ${lon.toFixed(2)}°\n`;
            report += `   太阳黄经：${consti.sunLon.toFixed(1)}°（${getSolarTermName(jd)}）\n`;
            report += `   地貌：${consti.terrain}，实际气候：${consti.actualQi} → 应脏腑：${consti.climateOrgan}\n`;
            report += `   时辰当令脏腑：${consti.zodiacOrgan}\n`;
            report += `   五脏偏性：肝${consti.constitution.肝.toFixed(1)} 心${consti.constitution.心.toFixed(1)} 脾${consti.constitution.脾.toFixed(1)} 肺${consti.constitution.肺.toFixed(1)} 肾${consti.constitution.肾.toFixed(1)}\n`;
            report += `   主导脏腑：${consti.strongest}（强），${consti.weakest}（弱）\n\n`;
        }
        let now = new Date();
        let last = sorted[sorted.length-1];
        let lastDate = new Date(last.dateStr);
        if (!isNaN(lastDate)) {
            let years = (now - lastDate) / (365.25*24*3600000);
            let currentJD = toJulianDay(now);
            let currentQi = getActualQiAndOrgan(currentLat, currentLon, sunApparentLongitude(currentJD)).actualQi;
            report += `⏳ 距离「${last.name}」已过 ${years.toFixed(1)} 年，当前实际气候为「${currentQi}」，建议顺应此气调养。\n`;
        }
        document.getElementById('trajectoryReport').innerHTML = report.replace(/\n/g,'<br>');
        lastReport = report;
    }

    function downloadTrajectory() {
        if (!lastReport) { alert('请先分析'); return; }
        const blob = new Blob([lastReport], {type:'text/plain'});
        const a = document.createElement('a');
        const url = URL.createObjectURL(blob);
        a.href = url;
        a.download = `人生轨迹_${new Date().toISOString().slice(0,19)}.txt`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // 初始化
    window.onload = () => {
        canvas = document.getElementById('clockCanvas');
        ctx = canvas.getContext('2d');
        canvas.width = 280; canvas.height = 280;
        document.getElementById('gpsBtn').onclick = requestGPS;
        document.getElementById('manualBtn').onclick = manualCalculate;
        document.getElementById('analyzeBirthBtn').onclick = analyzeBirth;
        document.getElementById('addEventBtn').onclick = addEvent;
        document.getElementById('analyzeTrajectoryBtn').onclick = analyzeTrajectory;
        document.getElementById('downloadTrajectoryBtn').onclick = downloadTrajectory;
        setCoordinates(39.9042, 116.4074, '默认坐标（北京）');
        setInterval(updateDisplay, 1000);
        events.push({ name: "出生", dateStr: "1990-03-21", lat: "39.9042", lon: "116.4074" });
        events.push({ name: "成都求学", dateStr: "2008-09-01", lat: "30.5728", lon: "104.0668" });
        events.push({ name: "深圳工作", dateStr: "2014-07-01", lat: "22.5431", lon: "114.0579" });
        renderEvents();
    };
</script>
