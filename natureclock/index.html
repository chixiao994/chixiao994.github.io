                <label>纬度</label><input type="text" id="birthLat" placeholder="纬度" value="39.9042">

            <button id="downloadTrajectoryBtn" class="btn-secondary btn-download">📥 下载事件报告</button>

<script>
    // ========== 天文计算（基于本地时间，无外部依赖） ==========
    
    // 获取当前本地时间的儒略日（使用UTC计算，但结果不变，因为儒略日是天文时间）
    function getJulianDay(year, month, day, hour, minute, second) {
        // month: 0-11, hour: 0-23
        let y = year;
        let m = month + 1;
        let d = day + hour/24 + minute/1440 + second/86400;
        if (m <= 2) { y--; m += 12; }
        let A = Math.floor(y/100);
        let B = 2 - A + Math.floor(A/4);
        let JD = Math.floor(365.25*(y+4716)) + Math.floor(30.6001*(m+1)) + d + B - 1524.5;
        return JD;
    }

    // 太阳平黄经
    function sunMeanLongitude(JD) {
        let T = (JD - 2451545.0) / 36525.0;
        let L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
        return L0 % 360;
    }

    // 太阳平近点角
    function sunMeanAnomaly(JD) {
        let T = (JD - 2451545.0) / 36525.0;
        let M = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
        return M % 360;
    }

    // 太阳真黄经（考虑中心差）
    function sunTrueLongitude(JD) {
        let M = sunMeanAnomaly(JD);
        let Mrad = M * Math.PI/180;
        let T = (JD - 2451545.0) / 36525.0;
        let C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(Mrad);
        C += (0.019993 - 0.000101 * T) * Math.sin(2 * Mrad);
        C += 0.000289 * Math.sin(3 * Mrad);
        let sunLong = sunMeanLongitude(JD) + C;
        return sunLong % 360;
    }

    // 太阳视黄经（考虑章动）
    function sunApparentLongitude(JD) {
        let T = (JD - 2451545.0) / 36525.0;
        let omega = 125.04452 - 1934.136261 * T;
        let lambda = sunTrueLongitude(JD) - 0.00569 - 0.00478 * Math.sin(omega * Math.PI/180);
        return lambda % 360;
    }

    // 太阳赤纬
    function sunDeclination(JD) {
        let lambda = sunApparentLongitude(JD) * Math.PI/180;
        let T = (JD - 2451545.0) / 36525.0;
        let epsilon = (23.439291 - 0.0130042 * T) * Math.PI/180;
        let sinDec = Math.sin(lambda) * Math.sin(epsilon);
        let dec = Math.asin(sinDec) * 180 / Math.PI;
        return dec;
    }

    // 均时差（分钟）
    function equationOfTime(JD) {
        let T = (JD - 2451545.0) / 36525.0;
        let eps = (23.439291 - 0.0130042 * T) * Math.PI/180;
        let L0 = sunMeanLongitude(JD) * Math.PI/180;
        let M = sunMeanAnomaly(JD) * Math.PI/180;
        let e = 0.016708634 - 0.000042037 * T - 0.0000001267 * T * T;
        let y = Math.tan(eps/2) ** 2;
        let equation = y * Math.sin(2*L0) - 2*e*Math.sin(M) + 4*e*y*Math.sin(M)*Math.cos(2*L0) - 0.5*y*y*Math.sin(4*L0) - 1.25*e*e*Math.sin(2*M);
        return equation * 4 * 180 / Math.PI; // 分钟
    }

    // 日出日落（返回本地真太阳时的小时数）
    function getSunriseSunset(lat, lon, year, month, day) {
        // 计算该日正午的儒略日（使用UTC，但儒略日与时间无关，只与日期有关，用当地正午的UTC时间即可）
        // 为了简化，我们使用该日0点作为基准，但日出日落计算需要正午的太阳赤纬，可以用正午的JD
        let noonLocal = new Date(Date.UTC(year, month, day, 12, 0, 0));
        let JD = getJulianDay(noonLocal.getUTCFullYear(), noonLocal.getUTCMonth(), noonLocal.getUTCDate(), 12, 0, 0);
        let dec = sunDeclination(JD) * Math.PI/180;
        let phi = lat * Math.PI/180;
        let cosHa = (Math.sin(-0.833 * Math.PI/180) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec));
        if (cosHa <= -1) return [0, 24];
        if (cosHa >= 1) return [0, 24];
        let Ha = Math.acos(cosHa); // 时角（弧度）
        let eot = equationOfTime(JD); // 分钟
        let lonCorr = lon / 15;
        let noonLocalSolar = 12 - lonCorr - eot/60; // 正午的本地真太阳时（应该等于12，但这里用于计算日出日落偏移）
        // 实际上，日出日落时刻 = 正午真太阳时 ± 时角（小时）
        let sunrise = noonLocalSolar - Ha * 12 / Math.PI;
        let sunset = noonLocalSolar + Ha * 12 / Math.PI;
        sunrise = (sunrise % 24 + 24) % 24;
        sunset = (sunset % 24 + 24) % 24;
        return [sunrise, sunset];
    }

    // 真太阳时（基于当前本地时间）
    function getTrueSolarTime(lat, lon, now) {
        let year = now.getFullYear();
        let month = now.getMonth();
        let day = now.getDate();
        let hour = now.getHours();
        let minute = now.getMinutes();
        let second = now.getSeconds();
        // 计算当前时刻的儒略日（使用UTC等效时间，但这里我们直接用本地时间的年月日小时，儒略日计算不受时区影响，因为需要的是天文时间）
        // 更精确：将本地时间转换为UTC时间再计算。但为了简化，我们直接用本地时间作为UTC？不对，会导致误差。但我们可以使用 `new Date(Date.UTC(...))` 来构造UTC时间。
        let utc = new Date(Date.UTC(year, month, day, hour, minute, second));
        let JD = getJulianDay(utc.getUTCFullYear(), utc.getUTCMonth(), utc.getUTCDate(), utc.getUTCHours(), utc.getUTCMinutes(), utc.getUTCSeconds());
        let eot = equationOfTime(JD);
        let lonCorr = lon / 15;
        // 当前UTC时间的小时数
        let utcHours = utc.getUTCHours() + utc.getUTCMinutes()/60 + utc.getUTCSeconds()/3600;
        let noonUTC = 12 - lonCorr - eot/60; // 正午的UTC时间
        let trueSolar = 12 + (utcHours - noonUTC);
        trueSolar = (trueSolar % 24 + 24) % 24;
        return trueSolar;
    }

    // 节气名称
    const solarTermsNorth = ["春分","清明","谷雨","立夏","小满","芒种","夏至","小暑","大暑","立秋","处暑","白露","秋分","寒露","霜降","立冬","小雪","大雪","冬至","小寒","大寒","立春","雨水","惊蛰"];
    const solarTermsSouth = ["秋分","寒露","霜降","立冬","小雪","大雪","冬至","小寒","大寒","立春","雨水","惊蛰","春分","清明","谷雨","立夏","小满","芒种","夏至","小暑","大暑","立秋","处暑","白露"];

    function getSolarTermName(JD, lat) {
        let sunLon = sunApparentLongitude(JD);
        let idx = Math.floor((sunLon + 7.5) % 360 / 15);
        if (lat < 0) return solarTermsSouth[idx];
        return solarTermsNorth[idx];
    }

    // 主气
    function getMainQi(lat, sunLon) {
        let isNorth = lat >= 0;
        if (isNorth) {
            if ((sunLon >= 315) || (sunLon < 45)) return "寒";
            if (sunLon >= 45 && sunLon < 135) return "暑";
            if (sunLon >= 135 && sunLon < 225) return "湿";
            if (sunLon >= 225 && sunLon < 315) return "燥";
            return "风";
        } else {
            if ((sunLon >= 315) || (sunLon < 45)) return "暑";
            if (sunLon >= 45 && sunLon < 135) return "寒";
            if (sunLon >= 135 && sunLon < 225) return "风";
            if (sunLon >= 225 && sunLon < 315) return "湿";
            return "风";
        }
    }

    const qiToOrgan = {
        "寒": "肾", "暑": "心", "燥": "肺", "湿": "脾", "风": "肝"
    };

    // 时辰脏腑
    const organMap = {0:"胆",1:"肝",2:"肺",3:"大肠",4:"胃",5:"脾",6:"心",7:"小肠",8:"膀胱",9:"肾",10:"心包",11:"三焦"};
    function getZodiacIndex(trueSolarHour) { let h = (trueSolarHour + 1) % 24; return Math.floor(h / 2) % 12; }

    // 干支
    const gan = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
    const zhi = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
    function getDayGanZhi(date) {
        let a = Math.floor((date.getTime() - new Date(1900,0,1).getTime())/86400000) + 10;
        return gan[a % 10] + zhi[a % 12];
    }
    function getHourGanZhi(date, trueSolarHour) {
        let dayGan = getDayGanZhi(date)[0];
        let dayGanIdx = gan.indexOf(dayGan);
        let startGan = (dayGanIdx % 5) * 2;
        let hourIdx = Math.floor((trueSolarHour + 1) % 24 / 2);
        let ganIdx = (startGan + hourIdx) % 10;
        let zhiIdx = hourIdx % 12;
        return gan[ganIdx] + zhi[zhiIdx];
    }
    function getFullGanZhi(date, trueSolarHour) {
        let dayGanZhi = getDayGanZhi(date);
        let hourGanZhi = getHourGanZhi(date, trueSolarHour);
        return `${dayGanZhi}日 ${hourGanZhi}时`;
    }

    // 灵龟八法
    function getLingGuiAcupoint(dayGanZhi, hourGanZhi) {
        const baseNumbers = { "甲":10, "乙":9, "丙":8, "丁":7, "戊":6, "己":5, "庚":4, "辛":3, "壬":2, "癸":1 };
        const zhiNumbers = { "子":7, "丑":6, "寅":5, "卯":4, "辰":3, "巳":2, "午":1, "未":9, "申":8, "酉":7, "戌":6, "亥":5 };
        const acupoints = ["公孙", "内关", "临泣", "外关", "列缺", "照海", "申脉", "后溪"];
        const remainderMap = [0,1,2,3,4,5,6,7,0,1];
        let dayGanChar = dayGanZhi[0];
        let hourGanChar = hourGanZhi[0];
        let hourZhiChar = hourGanZhi[1];
        let dayNum = baseNumbers[dayGanChar];
        let hourGanNum = baseNumbers[hourGanChar];
        let hourZhiNum = zhiNumbers[hourZhiChar];
        let sum = dayNum + hourGanNum + hourZhiNum;
        let remainder = sum % 6;
        let idx = remainderMap[remainder];
        return acupoints[idx];
    }

    // 禀赋计算（简化，保留核心）
    function computeConstitutionAt(jd, lat, lon, date) {
        let sunLon = sunApparentLongitude(jd);
        let { qi: actualQi, organ: climateOrgan } = getActualQiAndOrgan(lat, sunLon);
        let trueSolar = getTrueSolarTime(lat, lon, date);
        let zodiacIdx = getZodiacIndex(trueSolar);
        let zodiacOrgan = organMap[zodiacIdx];
        let constitution = {肝:0,心:0,脾:0,肺:0,肾:0};
        let mainOrgan = climateOrgan.split('')[0];
        if (mainOrgan && constitution[mainOrgan] !== undefined) constitution[mainOrgan] += 1;
        constitution[zodiacOrgan] += 0.5;
        let absLat = Math.abs(lat);
        if (absLat > 45) constitution["肾"] += 0.4;
        else if (absLat < 23.5) constitution["心"] += 0.4;
        else constitution["脾"] += 0.2;
        let sorted = Object.entries(constitution).sort((a,b)=>b[1]-a[1]);
        return { constitution, strongest: sorted[0][0], weakest: sorted[3][0], actualQi, climateOrgan, zodiacOrgan, sunLon };
    }

    function getActualQiAndOrgan(lat, sunLon) {
        let qi = getMainQi(lat, sunLon);
        let organ = qiToOrgan[qi] || "脾";
        return { qi, organ };
    }

    let currentLat = null, currentLon = null;
    let canvas, ctx;
    let events = [];
    let lastReport = "";

    function updateDisplay() {
        if (currentLat === null || currentLon === null) return;
        const now = new Date(); // 本地时间
        const year = now.getFullYear();
        const month = now.getMonth();
        const day = now.getDate();
        // 正午儒略日用于节气等（日期相关）
        let noonUTC = new Date(Date.UTC(year, month, day, 12, 0, 0));
        let JD = getJulianDay(noonUTC.getUTCFullYear(), noonUTC.getUTCMonth(), noonUTC.getUTCDate(), 12, 0, 0);
        let sunLon = sunApparentLongitude(JD);
        let { qi: actualQi, organ: climateOrgan } = getActualQiAndOrgan(currentLat, sunLon);
        document.getElementById('actualQi').innerHTML = actualQi;
        document.getElementById('climateOrgan').innerHTML = climateOrgan;
        document.getElementById('hemisphere').innerHTML = currentLat >= 0 ? "北半球" : "南半球";

        let trueSolar = getTrueSolarTime(currentLat, currentLon, now);
        let zodiacIdx = getZodiacIndex(trueSolar);
        document.getElementById('dangling').innerHTML = organMap[zodiacIdx];

        let localDate = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
        document.getElementById('localDate').innerHTML = `${localDate.getFullYear()}-${(localDate.getMonth()+1).toString().padStart(2,'0')}-${localDate.getDate().toString().padStart(2,'0')}`;
        let h = Math.floor(trueSolar), m = Math.floor((trueSolar-h)*60), s = Math.floor(((trueSolar-h)*60 - m)*60);
        document.getElementById('trueTime').innerHTML = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        document.getElementById('sunLongitude').innerHTML = sunLon.toFixed(1) + '°';
        
        let term = getSolarTermName(JD, currentLat);
        document.getElementById('term').innerHTML = term;
        
        let [sunrise, sunset] = getSunriseSunset(currentLat, currentLon, year, month, day);
        let sunriseH = Math.floor(sunrise), sunriseM = Math.floor((sunrise - sunriseH)*60);
        let sunsetH = Math.floor(sunset), sunsetM = Math.floor((sunset - sunsetH)*60);
        document.getElementById('sunrise').innerHTML = `${sunriseH.toString().padStart(2,'0')}:${sunriseM.toString().padStart(2,'0')}`;
        document.getElementById('sunset').innerHTML = `${sunsetH.toString().padStart(2,'0')}:${sunsetM.toString().padStart(2,'0')}`;

        let dayGanZhi = getDayGanZhi(localDate);
        let hourGanZhi = getHourGanZhi(localDate, trueSolar);
        let fullGanZhi = getFullGanZhi(localDate, trueSolar);
        document.getElementById('fullGanZhi').innerHTML = fullGanZhi;
        let acupoint = getLingGuiAcupoint(dayGanZhi, hourGanZhi);
        document.getElementById('lingGuiAcupoint').innerHTML = acupoint;

        let tip = `半球：${currentLat>=0?"北":"南"}，主气：${actualQi} → 宜调「${climateOrgan}」；时辰当令「${organMap[zodiacIdx]}」；灵龟开穴「${acupoint}」。`;
        document.getElementById('dailyTip').innerHTML = `✨ ${tip}`;
        drawClock(zodiacIdx);
    }

    function drawClock(traditionalIdx) {
        if (!canvas) return;
        const size = canvas.width;
        ctx.clearRect(0,0,size,size);
        ctx.save(); ctx.translate(size/2,size/2); ctx.rotate(-Math.PI/2);
        const zodiacDisplay = ["午","未","申","酉","戌","亥","子","丑","寅","卯","辰","巳"];
        for (let i=0;i<12;i++) {
            let angle = i*30*Math.PI/180;
            ctx.beginPath(); ctx.moveTo((size/2-20)*Math.cos(angle),(size/2-20)*Math.sin(angle));
            ctx.lineTo((size/2-5)*Math.cos(angle),(size/2-5)*Math.sin(angle)); ctx.stroke();
            let r=size/2-32, x=r*Math.cos(angle), y=r*Math.sin(angle);
            ctx.save(); ctx.translate(x,y); ctx.rotate(Math.PI/2);
            ctx.font = `bold ${size/18}px "Segoe UI"`; ctx.fillStyle="#5a4a3a";
            ctx.textAlign="center"; ctx.textBaseline="middle";
            ctx.fillText(zodiacDisplay[i],0,0); ctx.restore();
        }
        let displayIdx = (traditionalIdx+6)%12;
        let start=displayIdx*30*Math.PI/180, end=(displayIdx+1)*30*Math.PI/180;
        ctx.beginPath(); ctx.arc(0,0,size/2-10,start,end); ctx.lineWidth=4; ctx.strokeStyle="#e6b422"; ctx.stroke();
        let pointer=(displayIdx*30+15)*Math.PI/180;
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo((size/2-35)*Math.cos(pointer),(size/2-35)*Math.sin(pointer)); ctx.stroke();
        ctx.beginPath(); ctx.arc(0,0,6,0,2*Math.PI); ctx.fillStyle="#bd7a4a"; ctx.fill();
        ctx.restore();
    }

    function setCoordinates(lat, lon, source) {
        currentLat = lat; currentLon = lon;
        document.getElementById('latInput').value = lat.toFixed(4);
        document.getElementById('lonInput').value = lon.toFixed(4);
        document.getElementById('sourceInfo').innerHTML = `📍 ${source} · 纬度 ${lat.toFixed(2)}° 经度 ${lon.toFixed(2)}°`;
        updateDisplay();
    }
    function requestGPS() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => setCoordinates(pos.coords.latitude, pos.coords.longitude, 'GPS自动定位'),
                () => alert('无法获取位置，请手动输入经纬度')
            );
        } else alert('浏览器不支持地理定位');
    }
    function manualCalculate() {
        let lat = parseFloat(document.getElementById('latInput').value);
        let lon = parseFloat(document.getElementById('lonInput').value);
        if (isNaN(lat)||isNaN(lon)) { alert('请输入有效数字'); return; }
        setCoordinates(lat, lon, '手动输入');
    }

    // 事件管理
    function renderEvents() {
        let container = document.getElementById('eventList');
        container.innerHTML = events.map((ev, idx) => `
            <div class="event-item">
                <input value="${ev.name}" data-idx="${idx}" data-field="name" placeholder="事件名" style="flex:1.5">
                <input type="date" value="${ev.dateStr}" data-idx="${idx}" data-field="dateStr" style="flex:1">
                <input value="${ev.lat}" data-idx="${idx}" data-field="lat" style="width:90px">
                <input value="${ev.lon}" data-idx="${idx}" data-field="lon" style="width:90px">
                <button data-idx="${idx}" class="remove-event">❌</button>
            </div>
        `).join('');
        document.querySelectorAll('.event-item input').forEach(inp => inp.addEventListener('change', e => {
            let idx = parseInt(e.target.dataset.idx), field = e.target.dataset.field;
            if (!isNaN(idx) && events[idx]) events[idx][field] = e.target.value;
        }));
        document.querySelectorAll('.remove-event').forEach(btn => btn.addEventListener('click', e => {
            let idx = parseInt(e.target.dataset.idx); if (!isNaN(idx)) { events.splice(idx,1); renderEvents(); }
        }));
    }
    
    function addEvent() { 
        events.push({ name:"新事件", dateStr:"2000-01-01", lat:"39.9042", lon:"116.4074" }); 
        renderEvents(); 
    }
    
    function analyzeBirth() {
        let birthDateStr = document.getElementById('birthDate').value;
        let birthTimeStr = document.getElementById('birthTime').value;
        let birthLat = parseFloat(document.getElementById('birthLat').value);
        let birthLon = parseFloat(document.getElementById('birthLon').value);
        if (isNaN(birthLat)||isNaN(birthLon)) { alert('出生地经纬度无效'); return; }
        let birthDateTime = new Date(birthDateStr + 'T' + birthTimeStr + ':00');
        if (isNaN(birthDateTime)) { alert('出生日期无效'); return; }
        // 将本地时间转换为UTC用于JD计算
        let utc = new Date(birthDateTime.getTime() - birthDateTime.getTimezoneOffset()*60000);
        let jd = getJulianDay(utc.getUTCFullYear(), utc.getUTCMonth(), utc.getUTCDate(), utc.getUTCHours(), utc.getUTCMinutes(), utc.getUTCSeconds());
        let consti = computeConstitutionAt(jd, birthLat, birthLon, birthDateTime);
        let term = getSolarTermName(jd, birthLat);
        let report = `【先天禀赋】\n出生：${birthDateStr} ${birthTimeStr}\n地点：${birthLat.toFixed(2)}°, ${birthLon.toFixed(2)}° ${birthLat>=0?"北半球":"南半球"}\n太阳黄经：${consti.sunLon.toFixed(1)}°（${term}）\n主气：${consti.actualQi} → 气候应脏腑：${consti.climateOrgan}\n时辰当令脏腑：${consti.zodiacOrgan}\n\n五脏相对值：肝${consti.constitution.肝.toFixed(1)} 心${consti.constitution.心.toFixed(1)} 脾${consti.constitution.脾.toFixed(1)} 肺${consti.constitution.肺.toFixed(1)} 肾${consti.constitution.肾.toFixed(1)}\n最强者：${consti.strongest}，最弱者：${consti.weakest}\n`;
        document.getElementById('trajectoryReport').innerHTML = report.replace(/\n/g,'<br>');
        lastReport = report;
    }
    
    function analyzeTrajectory() {
        if (events.length === 0) { document.getElementById('trajectoryReport').innerHTML = '暂无事件，请先添加大事件。'; return; }
        let sorted = [...events].sort((a,b)=> (a.dateStr||'') < (b.dateStr||'') ? -1 : 1);
        let report = `【人生轨迹 · 时空演化】\n\n`;
        for (let ev of sorted) {
            let dateObj = new Date(ev.dateStr);
            if (isNaN(dateObj)) continue;
            let utc = new Date(dateObj.getTime() - dateObj.getTimezoneOffset()*60000);
            let jd = getJulianDay(utc.getUTCFullYear(), utc.getUTCMonth(), utc.getUTCDate(), utc.getUTCHours(), utc.getUTCMinutes(), utc.getUTCSeconds());
            let lat = parseFloat(ev.lat), lon = parseFloat(ev.lon);
            if (isNaN(lat)||isNaN(lon)) continue;
            let consti = computeConstitutionAt(jd, lat, lon, dateObj);
            let term = getSolarTermName(jd, lat);
            report += `📌 ${ev.name}（${ev.dateStr}）\n`;
            report += `   地点：${lat.toFixed(2)}°, ${lon.toFixed(2)}° ${lat>=0?"北半球":"南半球"}\n`;
            report += `   太阳黄经：${consti.sunLon.toFixed(1)}°（${term}）\n`;
            report += `   主气：${consti.actualQi} → 应脏腑：${consti.climateOrgan}\n`;
            report += `   时辰当令脏腑：${consti.zodiacOrgan}\n`;
            report += `   五脏偏性：肝${consti.constitution.肝.toFixed(1)} 心${consti.constitution.心.toFixed(1)} 脾${consti.constitution.脾.toFixed(1)} 肺${consti.constitution.肺.toFixed(1)} 肾${consti.constitution.肾.toFixed(1)}\n`;
            report += `   主导脏腑：${consti.strongest}（强），${consti.weakest}（弱）\n\n`;
        }
        let now = new Date();
        let last = sorted[sorted.length-1];
        let lastDate = new Date(last.dateStr);
        if (!isNaN(lastDate)) {
            let years = (now - lastDate) / (365.25*24*3600000);
            let utcNow = new Date(now.getTime() - now.getTimezoneOffset()*60000);
            let currentJD = getJulianDay(utcNow.getUTCFullYear(), utcNow.getUTCMonth(), utcNow.getUTCDate(), utcNow.getUTCHours(), utcNow.getUTCMinutes(), utcNow.getUTCSeconds());
            let currentSunLon = sunApparentLongitude(currentJD);
            let currentQi = getMainQi(currentLat, currentSunLon);
            report += `⏳ 距离「${last.name}」已过 ${years.toFixed(1)} 年，当前主气为「${currentQi}」，建议顺应此气调养。\n`;
        }
        document.getElementById('trajectoryReport').innerHTML = report.replace(/\n/g,'<br>');
        lastReport = report;
    }
    
    function downloadTrajectory() {
        if (!lastReport) { alert('请先点击「分析人生轨迹」生成报告'); return; }
        const blob = new Blob([lastReport], {type:'text/plain'});
        const a = document.createElement('a');
        const url = URL.createObjectURL(blob);
        a.href = url;
        a.download = `人生轨迹_${new Date().toISOString().slice(0,19)}.txt`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    window.onload = () => {
        canvas = document.getElementById('clockCanvas');
        ctx = canvas.getContext('2d');
        canvas.width = 280; canvas.height = 280;
        document.getElementById('gpsBtn').onclick = requestGPS;
        document.getElementById('manualBtn').onclick = manualCalculate;
        document.getElementById('addEventBtn').onclick = addEvent;
        document.getElementById('analyzeBirthBtn').onclick = analyzeBirth;
        document.getElementById('analyzeTrajectoryBtn').onclick = analyzeTrajectory;
        document.getElementById('downloadTrajectoryBtn').onclick = downloadTrajectory;
        setCoordinates(39.9042, 116.4074, '默认坐标（北京）');
        setInterval(updateDisplay, 1000);
        events.push({ name:"出生", dateStr:"1990-03-21", lat:"39.9042", lon:"116.4074" });
        events.push({ name:"大学就读", dateStr:"2008-09-01", lat:"31.2304", lon:"121.4737" });
        events.push({ name:"工作定居", dateStr:"2014-07-01", lat:"22.5431", lon:"114.0579" });
        renderEvents();
    };
</script>
